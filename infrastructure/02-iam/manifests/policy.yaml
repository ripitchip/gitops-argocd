apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: auth-security-hardened
  namespace: auth
spec:
  endpointSelector: {}
  ingress:
    # 1. Internal Namespace Traffic
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": auth
    # 2. External Traffic via Traefik
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8089"
              protocol: TCP
    # 3. OIDC Clients (ArgoCD, Cloudreve, Radicale, Grafana, etc.)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argocd
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cloudreve
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": radicale
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": grafana
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # 4. Internal Tools (Vault)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # 5. MONITORING: Allow Alloy to scrape metrics
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": auth
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toFQDNs:
        - matchName: "ssl0.ovh.net"
      toPorts:
        - ports:
            - port: "465"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
