# --- 1. DEFAULT DENY ALL ---
# Blocks all traffic by default (Zero Trust)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: auth
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# --- 2. CORE DNS ACCESS ---
# Required for service discovery (resolving 'postgres', 'vault', etc.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: auth
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
---
# --- 3. KEYCLOAK EGRESS (DB & LDAP) ---
# Allows Keycloak to initiate connections to Postgres and OpenLDAP
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-egress
  namespace: auth
spec:
  podSelector: { matchLabels: { app: keycloak } }
  policyTypes: [Egress]
  egress:
  - to: # To Postgres
    - podSelector: { matchLabels: { app: postgres } }
    ports:
    - { protocol: TCP, port: 5432 }
  - to: # To OpenLDAP
    - podSelector: { matchLabels: { app: openldap } }
    ports:
    - { protocol: TCP, port: 389 }
    - { protocol: TCP, port: 636 }
---
# --- 4. POSTGRES & LDAP INGRESS ---
# Allows DB and LDAP to receive traffic from Keycloak
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-ldap-ingress
  namespace: auth
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: keycloak } }
    ports:
    - { protocol: TCP, port: 5432 } # Postgres
    - { protocol: TCP, port: 389 }  # LDAP
    - { protocol: TCP, port: 636 }  # LDAPS
---
# --- 5. EXTERNAL INGRESS (TRAEFIK) ---
# Allows Traefik to route traffic to Keycloak
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-keycloak
  namespace: auth
spec:
  podSelector: { matchLabels: { app: keycloak } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: traefik }
    ports:
    - { protocol: TCP, port: 8080 }
---
# --- 6. SECRET MANAGEMENT (VAULT) ---
# Allows pods (ExternalSecrets/SA) to reach Vault on port 8200
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-vault
  namespace: auth
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: vault }
    ports:
    - { protocol: TCP, port: 8200 }