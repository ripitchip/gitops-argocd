apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app: opencloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-config
          image: opencloudeu/opencloud-rolling:9.1.0
          command: ["/bin/sh", "-c"]
          args: ["opencloud init || true"]
          env:
            # sans ça, "opencloud init" demande une réponse interactive sur stdin
            # (qui n'existe pas dans un pod) et boucle indéfiniment sur le prompt
            - name: OC_INSECURE
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: data
              mountPath: /var/lib/opencloud
              subPath: data
        # `opencloud init` écrit un seul fichier /etc/opencloud/opencloud.yaml avec une clé
        # top-level par service (proxy:, graph:, idm:, ...). role-mapping.yaml doit donc être
        # mergé dans la clé "proxy:" existante, pas juste concaténé (sinon clé dupliquée/ignorée).
        - name: merge-role-mapping
          image: mikefarah/yq:4.44.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
                /etc/opencloud/opencloud.yaml /etc/opencloud-role-mapping/role_assignment.yaml \
                > /tmp/merged.yaml
              cat /tmp/merged.yaml > /etc/opencloud/opencloud.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: role-mapping
              mountPath: /etc/opencloud-role-mapping
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Idem que merge-role-mapping ci-dessus : ajoute les routes caldav/carddav/calshare
        # (voir calendar-proxy.yaml) sous la clé "proxy:" déjà présente. __CALSHARE_SECRET__
        # est substitué avant le merge : la vraie valeur ne vit que dans le Secret
        # opencloud-secrets (Vault, clé CALSHARE_PROXY_SECRET), jamais dans le ConfigMap (repo public).
        - name: merge-calendar-proxy
          image: mikefarah/yq:4.44.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              sed "s/__CALSHARE_SECRET__/$CALSHARE_SECRET/g" \
                /etc/opencloud-calendar-proxy/caldav_routes.yaml > /tmp/caldav_routes.yaml
              yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
                /etc/opencloud/opencloud.yaml /tmp/caldav_routes.yaml \
                > /tmp/merged.yaml
              cat /tmp/merged.yaml > /etc/opencloud/opencloud.yaml
          env:
            - name: CALSHARE_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: CALSHARE_PROXY_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: calendar-proxy
              mountPath: /etc/opencloud-calendar-proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # https://github.com/paulmascarilla/opencloud-calendar-share v0.5.0, sha256-verified,
        # dropped into $OC_DATA_DIR/web/assets/apps (auto-discovered, no config.json entry).
        # Remplace l'extension mschneider82/opencloud-web-calendar (jamais fonctionnelle sur
        # OpenCloud >= 6.2 : AMD, pas un remote Module Federation) ; celle-ci en est un (voir
        # manifest.json: entrypoint js/remoteEntry-*.mjs).
        - name: install-calendar-webapp
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import hashlib, io, os, shutil, urllib.request, zipfile
              url = "https://github.com/paulmascarilla/opencloud-calendar-share/releases/download/v0.5.0/calendar-0.5.0.zip"
              expected_sha256 = "6e8adc3ab964f57d39b89b767cb25422df20f14e5dd3552c0d8b440e4dc9f60a"
              data = urllib.request.urlopen(url).read()
              digest = hashlib.sha256(data).hexdigest()
              assert digest == expected_sha256, f"sha256 mismatch: got {digest}"
              target = "/var/lib/opencloud/web/assets/apps"
              # wipe leftovers: the new "calendar" dir (idempotency) and the abandoned web-calendar one
              shutil.rmtree(f"{target}/calendar", ignore_errors=True)
              shutil.rmtree(f"{target}/web-calendar", ignore_errors=True)
              os.makedirs(target, exist_ok=True)
              zipfile.ZipFile(io.BytesIO(data)).extractall(target)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
              subPath: data
        # https://github.com/opencloud-eu/web-extensions v2.2.0 (official, same org as OpenCloud
        # itself), sha256-verified. CSP already allows embed.diagrams.net (frame-src, above).
        - name: install-draw-io
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import hashlib, io, os, shutil, urllib.request, zipfile
              url = "https://github.com/opencloud-eu/web-extensions/releases/download/draw-io-v2.2.0/draw-io-2.2.0.zip"
              expected_sha256 = "49c3aa32aa517f2a90f249b5470b38dc18b7d006841c442f64335d660b551d0c"
              data = urllib.request.urlopen(url).read()
              digest = hashlib.sha256(data).hexdigest()
              assert digest == expected_sha256, f"sha256 mismatch: got {digest}"
              target = "/var/lib/opencloud/web/assets/apps"
              shutil.rmtree(f"{target}/draw-io", ignore_errors=True)
              os.makedirs(target, exist_ok=True)
              zipfile.ZipFile(io.BytesIO(data)).extractall(target)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
              subPath: data
      containers:
        - name: opencloud
          image: opencloudeu/opencloud-rolling:9.1.0
          command: ["opencloud"]
          args: ["server"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OC_URL
              value: "https://cloud.tomlab.fr"
            # TLS terminé par l'ingress Cilium
            - name: PROXY_TLS
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
            - name: OC_INSECURE
              value: "false"
            - name: OC_LOG_LEVEL
              value: "info"
            # NFS : pas d'inotify/xattrs fiables, donc pas de driver posix
            - name: STORAGE_USERS_DRIVER
              value: "decomposed"
            # --- OIDC : Keycloak externe (client public "web" dans le realm) ---
            - name: OC_OIDC_ISSUER
              value: "https://auth.foobarbaz.fr/realms/foobarbaz"
            # l'IDP intégré est remplacé par Keycloak, l'IDM (LDAP interne) reste
            - name: OC_EXCLUDE_RUN_SERVICES
              value: "idp"
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_USER_OIDC_CLAIM
              value: "preferred_username"
            - name: PROXY_USER_CS3_CLAIM
              value: "username"
            # les comptes sont créés dans l'IDM à la première connexion
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: OC_LDAP_SERVER_WRITE_ENABLED
              value: "true"
            - name: GRAPH_USERNAME_MATCH
              value: "none"
            # rôle attribué selon le groupe Keycloak (claim "groups"), voir role-mapping.yaml
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: "oidc"
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: "groups"
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "true"
            - name: WEB_OPTION_ACCOUNT_EDIT_LINK_HREF
              value: "https://auth.foobarbaz.fr/realms/foobarbaz/account"
            # le navigateur doit pouvoir joindre Keycloak (connect-src / frame-src)
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: "/etc/opencloud-csp/csp.yaml"
            # only way to inject "external_apps" (see web-calendar-config.yaml)
            - name: WEB_UI_CONFIG_FILE
              value: "/etc/opencloud-web-config/config.json"
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: IDM_ADMIN_PASSWORD
          ports:
            - containerPort: 9200
              name: http
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: data
              mountPath: /var/lib/opencloud
              subPath: data
            - name: csp
              mountPath: /etc/opencloud-csp
              readOnly: true
            - name: web-config
              mountPath: /etc/opencloud-web-config
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data-pvc
        - name: csp
          configMap:
            name: opencloud-csp
        - name: web-config
          configMap:
            name: opencloud-web-config
        - name: role-mapping
          configMap:
            name: opencloud-role-mapping
        - name: calendar-proxy
          configMap:
            name: opencloud-calendar-proxy
        - name: tmp
          emptyDir: {}
