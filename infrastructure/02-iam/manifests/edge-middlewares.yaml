apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: auth
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: camera=(), microphone=(), geolocation=()
    # We allow framing for OIDC check-session iframe but restrict to our domain
    customFrameHeaders:
      X-Frame-Options: "SAMEORIGIN"
    contentSecurityPolicy: 'default-src ''self'' ''unsafe-inline'' ''unsafe-eval''; img-src ''self'' data: https:; frame-ancestors ''self'' https://*.foobarbaz.fr;'
    # COOP/COEP are removed to allow standard OIDC redirection and cross-origin iframe communication
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-rate-limit
  namespace: auth
spec:
  rateLimit:
    average: 30
    burst: 60
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-chain
  namespace: auth
spec:
  chain:
    middlewares:
    - name: crowdsec-bouncer
      namespace: crowdsec
    - name: security-headers
    - name: login-rate-limit
