apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: hubble-stack-policy
  namespace: hubble
spec:
  endpointSelector: {} # Appliqué à tout le namespace hubble
  ingress:
    # 1. Autoriser Traefik vers l'UI Hubble
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "app.kubernetes.io/name": traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # 2. Autoriser l'UI vers le Relay
    - fromEndpoints:
        - matchLabels:
            k8s-app: hubble-ui
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP

  egress:
    # 1. Autoriser tout le namespace à contacter le DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # 2. Autoriser le Relay vers les agents Cilium (kube-system)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s-app": cilium
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
    # 3. Autoriser Hubble UI vers Kubernetes API
    - toEntities:
        - kube-apiserver
