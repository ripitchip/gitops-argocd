apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-config
  namespace: immich
data:
  # Core
  IMMICH_VERSION: v2.7.5
  NODE_ENV: production
  TZ: Europe/Paris
  
  # Database
  DB_HOSTNAME: immich-postgres
  DB_USERNAME: immich
  DB_DATABASE_NAME: immich
  
  # Redis
  REDIS_HOSTNAME: immich-redis
  
  # Services
  IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
  UPLOAD_LOCATION: /usr/src/app/upload
  
  # Network
  IMMICH_HOST: 0.0.0.0
  IMMICH_PORT: "2283"
  
  # Logging
  LOG_LEVEL: info
