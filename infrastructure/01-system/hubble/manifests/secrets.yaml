apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubble-relay-client-certs
  namespace: hubble
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hubble-relay-client-certs
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: hubble-relay-client-certs # Assuming these are stored/mirrored in Vault or we use a Kubernetes store
---
# Alternative: Simple Secret Mirroring if Vault is not used for internal cluster certs
apiVersion: v1
kind: Secret
metadata:
  name: hubble-relay-client-certs
  namespace: hubble
  annotations:
    kubernetes.io/service-account.name: hubble-relay
type: kubernetes.io/tls
data:
  # This will be populated by Cilium or we'll need to manually mirror it if Cilium doesn't support other namespaces.
  # For now, let's assume we use the existing secrets in kube-system and authorize cross-namespace access.
