# 1. ServiceAccount for Vault Auth in notifications namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: notifications
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
# 2. SecretStore pointing to Vault with ntfy-role
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: notifications
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ntfy-role"
          serviceAccountRef:
            name: "vault-auth"
---
# 3. Synchronize ntfy OAuth2 Proxy Secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-oauth2-proxy-creds
  namespace: notifications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ntfy-oauth2-proxy-creds
    creationPolicy: Owner
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: ntfy-oauth2-proxy
        property: cookie_secret
    - secretKey: client-id
      remoteRef:
        key: ntfy-oauth2-proxy
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: ntfy-oauth2-proxy
        property: client_secret
