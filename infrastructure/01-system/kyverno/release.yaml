apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: 'https://kyverno.github.io/kyverno/'
    chart: kyverno
    targetRevision: 3.2.6
    helm:
      values: |
        admissionController:
          replicas: 3
        backgroundController:
          replicas: 2
        reportsController:
          replicas: 2
        features:
          metricsConfig:
            enabled: true
            serviceMonitor:
              enabled: false
        cleanupController:
          replicas: 2
          image:
            registry: public.ecr.aws
            repository: bitnami/kubectl
            tag: 1.30.0
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Force=true
