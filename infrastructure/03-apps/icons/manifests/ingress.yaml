apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: icons
  namespace: icons
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    ingress.cilium.io/loadbalancer-mode: "shared"
spec:
  ingressClassName: cilium
  rules:
    - host: icon.foobarbaz.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: icons
                port:
                  number: 80
  tls:
    - hosts:
        - icon.foobarbaz.fr
      secretName: icons-tls
