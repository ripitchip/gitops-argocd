apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    # Gluetun needs NET_ADMIN + a hostPath /dev/net/tun to build the WireGuard
    # tunnel, both disallowed by the cluster-default "baseline" Pod Security
    # level. Scoped to this namespace only; every other app stays at baseline.
    pod-security.kubernetes.io/enforce: privileged
