apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator-polr-adapter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://fjogeleit.github.io/trivy-operator-polr-adapter'
    chart: trivy-operator-polr-adapter
    targetRevision: 0.12.0
    helm:
      values: |
        adapters:
          vulnerabilityReports:
            enabled: true
          configAuditReports:
            enabled: true
          exposedSecretReports:
            enabled: true
          rbacAssessmentReports:
            enabled: true
          infraAssessmentReports:
            enabled: true
          clusterComplianceReports:
            enabled: true
          clusterVulnerabilityReports:
            enabled: true
        serviceMonitor:
          enabled: false
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
