apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 45249
        runAsGroup: 45249
        fsGroup: 45249
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download-lyrics-plugin
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              mkdir -p /data/plugins
              if [ ! -f /data/plugins/nd-lyrics.ndp ]; then
                curl -L -s -o /data/plugins/nd-lyrics.ndp https://github.com/J0R6IT0/navidrome-lyrics-plugin/releases/latest/download/nd-lyrics.ndp
              fi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: navidrome
          image: deluan/navidrome:0.62.0
          ports:
            - containerPort: 4533
              name: http
          env:
            - name: ND_DATAFOLDER
              value: "/data"
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_LOGLEVEL
              value: "debug"
            - name: ND_EXTAUTH_TRUSTEDSOURCES
              value: "0.0.0.0/0"
            - name: ND_EXTAUTH_USERHEADER
              value: "X-Auth-Request-Preferred-Username"
            - name: ND_ENABLEUSEREDITING
              value: "true"
            - name: ND_PLUGINS_ENABLED
              value: "true"
            - name: ND_PLUGINS_FOLDER
              value: "/data/plugins"
            - name: ND_PLUGINS_LOGLEVEL
              value: "debug"
            - name: ND_LYRICSPRIORITY
              value: ".lrc,nd-lyrics,embedded"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"

        # Container sidecar pour récupérer automatiquement les paroles manquantes
        - name: lyrics-fetcher
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              cat << 'EOF' > /tmp/fetch_lyrics.py
              import os
              import sqlite3
              import urllib.request
              import urllib.parse
              import hashlib
              import random
              import string
              import sys

              NAVIDROME_DB = os.getenv("NAVIDROME_DB", "/data/navidrome.db")
              NAVIDROME_URL = os.getenv("NAVIDROME_URL", "http://localhost:4533")
              USERNAME = os.getenv("SUBSONIC_USER")
              PASSWORD = os.getenv("SUBSONIC_PASS")

              if not USERNAME or not PASSWORD:
                  print("Erreur: SUBSONIC_USER et SUBSONIC_PASS doivent etre definis.", file=sys.stderr)
                  sys.exit(1)

              def get_auth_params(username, password):
                  salt = "".join(random.choices(string.ascii_lowercase + string.digits, k=8))
                  token_input = password + salt
                  token = hashlib.md5(token_input.encode('utf-8')).hexdigest()
                  return f"u={username}&t={token}&s={salt}&v=1.16.1&c=lyrics-fetcher"

              def check_and_fetch():
                  if not os.path.exists(NAVIDROME_DB):
                      print(f"Erreur : La base de donnees {NAVIDROME_DB} est introuvable.", file=sys.stderr)
                      return

                  conn = sqlite3.connect(NAVIDROME_DB)
                  cursor = conn.cursor()

                  try:
                      cursor.execute("SELECT path, artist, title FROM media_file")
                      tracks = cursor.fetchall()
                  except sqlite3.OperationalError as e:
                      print(f"Erreur SQL : {e}", file=sys.stderr)
                      conn.close()
                      return

                  print(f"Analyse de {len(tracks)} morceaux...")
                  auth_query = get_auth_params(USERNAME, PASSWORD)
                  requests_sent = 0

                  for path, artist, title in tracks:
                      if not path or not artist or not title:
                          continue

                      base_path, _ = os.path.splitext(path)
                      lrc_path = base_path + ".lrc"
                      txt_path = base_path + ".txt"

                      if not os.path.exists(lrc_path) and not os.path.exists(txt_path):
                          print(f"-> Paroles manquantes : {artist} - {title}")
                          params = {'artist': artist, 'title': title}
                          encoded_params = urllib.parse.urlencode(params)
                          url = f"{NAVIDROME_URL}/rest/getLyrics.view?{auth_query}&{encoded_params}"

                          try:
                              urllib.request.urlopen(url)
                              requests_sent += 1
                          except Exception as e:
                              print(f"  Erreur lors de l'appel pour '{title}': {e}", file=sys.stderr)

                  print(f"Termine. {requests_sent} requetes de paroles envoyees.")
                  conn.close()

              if __name__ == "__main__":
                  check_and_fetch()
              EOF

              # Exécute le script toutes les heures (3600 secondes)
              while true; do
                python3 /tmp/fetch_lyrics.py
                sleep 3600
              done
          env:
            - name: SUBSONIC_USER
              valueFrom:
                secretKeyRef:
                  name: navidrome-lyrics-fetcher-creds
                  key: subsonic-user
            - name: SUBSONIC_PASS
              valueFrom:
                secretKeyRef:
                  name: navidrome-lyrics-fetcher-creds
                  key: subsonic-pass
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data-pvc
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music-pvc
