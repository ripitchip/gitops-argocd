apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: notifications
data:
  server.yml: |
    base-url: "https://ntfy.foobarbaz.fr"
    behind-proxy: true
    listen-http: ":8080"
    cache-file: "/var/lib/ntfy/cache.db"
    attachment-cache-dir: "/var/lib/ntfy/attachments"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ntfy-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /mnt/data/k8s-cluster/pvc-volumes/notifications-ntfy-data
    server: 10.0.60.10
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: notifications
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: ntfy-data-pv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: notifications
spec:
  selector:
    app: ntfy
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: notifications
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      securityContext:
        runAsUser: 11454
        runAsGroup: 11454
        fsGroup: 11454
        runAsNonRoot: true
      initContainers:
        - name: init-data
          image: busybox
          command: ["sh", "-c", "mkdir -p /var/lib/ntfy/attachments && chown -R 11454:11454 /var/lib/ntfy && chmod -R 775 /var/lib/ntfy"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.11.0
          args: ["serve"]
          securityContext:
            runAsUser: 11454
            runAsGroup: 11454
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy/server.yml
              subPath: server.yml
              readOnly: true
            - name: data
              mountPath: /var/lib/ntfy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
        - name: tmp
          emptyDir: {}
