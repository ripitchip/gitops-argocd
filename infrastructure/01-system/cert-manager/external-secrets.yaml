# 1. ServiceAccount for Vault Auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
# 2. SecretStore pointing to Vault
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cert-manager-role"
          serviceAccountRef:
            name: "vault-auth"
---
# 3. Synchronize OVH Credentials Secret from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ovh-credentials-sync
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ovh-credentials
    creationPolicy: Owner
  data:
    - secretKey: applicationKey
      remoteRef:
        key: ovh-secrets
        property: application-key
    - secretKey: applicationSecret
      remoteRef:
        key: ovh-secrets
        property: application-secret
    - secretKey: consumerKey
      remoteRef:
        key: ovh-secrets
        property: consumer-key
