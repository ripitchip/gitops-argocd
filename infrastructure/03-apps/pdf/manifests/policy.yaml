apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: stirling-pdf-isolation
  namespace: pdf
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf-chart
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "app.kubernetes.io/name": traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY