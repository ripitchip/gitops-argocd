apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-secrets-core
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: {} }]
  egress:
    - to: [{ podSelector: {} }]
    # 1. DNS
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    # 2. Vault
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: vault }
      ports: [{ protocol: TCP, port: 8200 }]
    # 3. KUBERNETES API (Internal Service IP + Global)
    - to:
        - ipBlock: { cidr: 10.96.0.0/12 } # Allow internal Service range
        - ipBlock: { cidr: 0.0.0.0/0 }    # Allow external Git/API
      ports: 
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }