apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: mimir-distributed
    targetRevision: 5.3.0
    helm:
      values: |
        deploymentMode: monolithic
        mimir:
          structuredConfig:
            multitenancy_enabled: false
            common:
              storage:
                backend: filesystem
            blocks_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/blocks
            alertmanager_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/alerts
            ruler_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/rules
            alertmanager:
              data_dir: /data/local/alertmanager
            compactor:
              data_dir: /data/local/compactor
            ruler:
              rule_path: /data/local/ruler

        # Shared Storage Mount (NFS)
        # We mount the shared PVC on all components that need access to the common filesystem backend
        commonSharedVolume: &commonSharedVolume
          extraVolumes:
            - name: mimir-storage
              persistentVolumeClaim:
                claimName: mimir-storage-pvc
          extraVolumeMounts:
            - name: mimir-storage
              mountPath: /mimir-storage

        ingester:
          replicas: 1
          persistentVolume:
            size: 10Gi
            storageClass: truenas-nfs
          <<: *commonSharedVolume

        querier:
          replicas: 1
          <<: *commonSharedVolume

        distributor:
          replicas: 1

        compactor:
          persistentVolume:
            size: 20Gi
            storageClass: truenas-nfs
          <<: *commonSharedVolume

        store_gateway:
          persistentVolume:
            size: 10Gi
            storageClass: truenas-nfs
          <<: *commonSharedVolume

        alertmanager:
          persistentVolume:
            size: 5Gi
            storageClass: truenas-nfs
          <<: *commonSharedVolume

        ruler:
          persistentVolume:
            size: 5Gi
            storageClass: truenas-nfs
          <<: *commonSharedVolume

        # Security Context for Kyverno compliance (Restricted Profile)
        global:
          podSecurityContext:
            runAsUser: 11985
            runAsGroup: 11985
            fsGroup: 11985
            runAsNonRoot: true
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 11985

        # Resource limits for Kyverno compliance
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        
        # Disable MinIO as we use NFS filesystem storage
        minio:
          enabled: false

        mimir-continuous-test:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mimir
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
