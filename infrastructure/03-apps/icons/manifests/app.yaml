apiVersion: v1
kind: Service
metadata:
  name: icons
  namespace: icons
spec:
  selector:
    app: icons
  ports:
    - name: http
      port: 80
      targetPort: 4050
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: icons
  namespace: icons
spec:
  replicas: 1
  selector:
    matchLabels:
      app: icons
  template:
    metadata:
      labels:
        app: icons
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 52444
        runAsGroup: 26335
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: icons
          image: ghcr.io/selfhst/icons:4.0.3
          env:
            - name: ICON_SOURCE
              value: local
          ports:
            - name: http
              containerPort: 4050
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 52444
            runAsGroup: 26335
          readinessProbe:
            exec:
              command: ["/server", "-healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/server", "-healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          volumeMounts:
            - name: icons-data
              mountPath: /app/icons
              readOnly: true
      volumes:
        - name: icons-data
          persistentVolumeClaim:
            claimName: icons-data-pvc
