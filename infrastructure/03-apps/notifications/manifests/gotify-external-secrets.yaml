apiVersion: v1
kind: ServiceAccount
metadata:
  name: gotify-vault-auth
  namespace: notifications
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gotify-vault-backend
  namespace: notifications
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "gotify-role"
          serviceAccountRef:
            name: "gotify-vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-secrets
  namespace: notifications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gotify-vault-backend
    kind: SecretStore
  target:
    name: gotify-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: gotify
        property: admin-password
    - secretKey: mailrise-app-token
      remoteRef:
        key: gotify
        property: mailrise-app-token
    - secretKey: oidc-client-secret
      remoteRef:
        key: gotify
        property: oidc-client-secret
    - secretKey: oidc-client-id
      remoteRef:
        key: gotify
        property: oidc-client-id
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailrise-config
  namespace: notifications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gotify-vault-backend
    kind: SecretStore
  target:
    name: mailrise-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        mailrise.conf: |
          configs:
            cluster-alerts:
              urls:
                - gotify://gotify:80/{{ .mailrise_app_token }}
            cluster-alerts@mailrise:
              urls:
                - gotify://gotify:80/{{ .mailrise_app_token }}
  data:
    - secretKey: mailrise_app_token
      remoteRef:
        key: gotify
        property: mailrise-app-token
