apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app: opencloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 62403
        runAsGroup: 62403
        fsGroup: 62403
      containers:
        - name: opencloud
          image: opencloudeu/opencloud:7.2.4
          command: ["opencloud", "server"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 62403
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OC_URL
              value: "https://drive.tomlab.fr"
            - name: OC_INSECURE
              value: "true"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
            - name: PROXY_TLS
              value: "false"
            - name: OC_LOG_LEVEL
              value: "info"
            # Keycloak External IDP Integration
            - name: OC_OIDC_ISSUER
              value: "https://auth.foobarbaz.fr/realms/foobarbaz"
            - name: OC_EXCLUDE_RUN_SERVICES
              value: "idp"
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: "jwt"
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_USER_OIDC_CLAIM
              value: "preferred_username"
            - name: PROXY_USER_CS3_CLAIM
              value: "username"
            - name: WEB_OPTION_ACCOUNT_EDIT_LINK_HREF
              value: "https://auth.foobarbaz.fr/realms/foobarbaz/account"
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: GRAPH_USERNAME_MATCH
              value: "none"
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: "default"
            - name: WEBFINGER_WEB_OIDC_CLIENT_ID
              value: "web"
            - name: WEBFINGER_WEB_OIDC_CLIENT_SCOPES
              value: "openid profile email"
            # Storage & Metadata Backend
            - name: OC_STORAGE_USERS_DRIVER
              value: "ocis"
            - name: STORAGE_USERS_DRIVER
              value: "ocis"
            - name: OC_STORAGE_USERS_OCIS_USER_METADATA_BACKEND
              value: "sqlite"
            - name: STORAGE_USERS_OCIS_USER_METADATA_BACKEND
              value: "sqlite"
            - name: OC_STORAGE_SYSTEM_DRIVER
              value: "ocis"
            - name: STORAGE_SYSTEM_DRIVER
              value: "ocis"
            - name: OC_STORAGE_SYSTEM_OCIS_USER_METADATA_BACKEND
              value: "sqlite"
            - name: STORAGE_SYSTEM_OCIS_USER_METADATA_BACKEND
              value: "sqlite"
            - name: OC_STORAGE_METADATA_DRIVER
              value: "sqlite"
            - name: STORAGE_METADATA_DRIVER
              value: "sqlite"
          ports:
            - containerPort: 9200
              name: http
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
            - name: config
              mountPath: /etc/opencloud
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data-pvc
        - name: config
          emptyDir: {}
