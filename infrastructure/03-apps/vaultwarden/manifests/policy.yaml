apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: pass-security-hardened
  namespace: pass
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": pass
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy

  egress:
    # Trafic interne au namespace
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": pass

    # DNS (indispensable pour toFQDNs)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

    # HashiCorp Vault
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # API Kubernetes
    - toEntities:
        - kube-apiserver

    # SMTP ProtonMail
    - toFQDNs:
        - matchName: "smtp.protonmail.ch"
        - matchPattern: "*.protonmail.ch"
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
            - port: "465"
              protocol: TCP
