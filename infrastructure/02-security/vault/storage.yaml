apiVersion: v1
kind: PersistentVolume
metadata:
  name: vault-pv-static
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
    - nolock
  nfs:
    server: "10.0.60.10"
    path: "/mnt/data/k8s-cluster/pvc-volumes/vault"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-vault-0
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  storageClassName: truenas-nfs
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  volumeName: vault-pv-static