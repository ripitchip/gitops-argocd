apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: linkwarden
  labels:
    app: karakeep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 25917:25917 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:0.32.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 25917
            runAsGroup: 25917
            runAsNonRoot: true
          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              value: "https://link.foobarbaz.fr"
            - name: DATA_DIR
              value: "/data"
            - name: MEILI_ADDR
              value: "http://karakeep-meilisearch:7700"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: MEILI_MASTER_KEY
            - name: OAUTH_WELLKNOWN_URL
              value: "https://auth.foobarbaz.fr/realms/foobarbaz/.well-known/openid-configuration"
            - name: OAUTH_CLIENT_ID
              value: "linkwarden"
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: OAUTH_CLIENT_SECRET
            - name: OAUTH_PROVIDER_NAME
              value: "Keycloak"
            - name: OAUTH_SCOPE
              value: "openid email profile"
            - name: OAUTH_AUTO_REDIRECT
              value: "true"
            - name: DISABLE_PASSWORD_AUTH
              value: "true"
            - name: LOG_LEVEL
              value: "notice"
            - name: BROWSER_WEB_URL
              value: "http://karakeep-chrome:9222"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data-pvc
