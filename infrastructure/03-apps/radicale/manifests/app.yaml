apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
  namespace: radicale
  labels:
    app: radicale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radicale
  template:
    metadata:
      labels:
        app: radicale
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 57238
        fsGroup: 57238
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 57238:57238 /data /plugins /config"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plugins
              mountPath: /plugins
            - name: config
              mountPath: /config
        - name: install-plugin
          image: python:3-alpine
          command: ["sh", "-c", "pip install --target /plugins requests"]
          volumeMounts:
            - name: plugins
              mountPath: /plugins
        - name: generate-config
          image: busybox:1.36
          env:
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: radicale-oauth2-creds
                  key: client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: radicale-oauth2-creds
                  key: client-secret
          command:
            [
              "sh",
              "-c",
              "sed \"s/\\${CLIENT_ID}/$CLIENT_ID/g; s/\\${CLIENT_SECRET}/$CLIENT_SECRET/g\" /config-template/config.template > /config/config",
            ]
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config
              mountPath: /config
      containers:
        - name: radicale
          image: tomsquest/docker-radicale:3.7.3.0
          env:
            - name: PYTHONPATH
              value: /plugins
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 57238
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5232
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plugins
              mountPath: /plugins
            - name: config
              mountPath: /config/config
              subPath: config
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: radicale-data-pvc
        - name: plugins
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: config-template
          configMap:
            name: radicale-config
            items:
              - key: config.template
                path: config.template
