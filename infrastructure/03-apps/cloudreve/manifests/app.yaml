apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudreve
  namespace: cloudreve
  labels:
    app: cloudreve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudreve
  template:
    metadata:
      labels:
        app: cloudreve
    spec:
      serviceAccountName: cloudreve-sa
      imagePullSecrets:
        - name: cloudreve-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 13010
        runAsGroup: 13010
        fsGroup: 13010
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 13010:13010 /cloudreve/uploads /cloudreve/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: cloudreve-data
              mountPath: /cloudreve/uploads
              subPath: uploads
            - name: cloudreve-data
              mountPath: /cloudreve/data
              subPath: data
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
      - name: cloudreve
        image: cloudreve.azurecr.io/cloudreve/pro:4.16.1
        ports:
        - containerPort: 5212
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudreve-secrets
              key: DB_PASSWORD
        - name: CR_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: cloudreve-secrets
              key: CR_LICENSE_KEY
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 13010
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: cloudreve-data
          mountPath: /cloudreve/uploads
          subPath: uploads
        - name: cloudreve-data
          mountPath: /cloudreve/data
          subPath: data
        - name: cloudreve-config
          mountPath: /cloudreve/conf.ini
          subPath: conf.ini
      volumes:
      - name: cloudreve-data
        persistentVolumeClaim:
          claimName: cloudreve-data-pvc
      - name: cloudreve-config
        configMap:
          name: cloudreve-config
---
apiVersion: v1
kind: Service
metadata:
  name: cloudreve
  namespace: cloudreve
spec:
  selector:
    app: cloudreve
  ports:
  - port: 5212
    targetPort: 5212
