# 1. Dedicated Identity for Vault in kube-system
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: kube-system
  annotations: { argocd.argoproj.io/sync-wave: "-9" }

---
# 2. Local SecretStore for Hubble Auth
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: kube-system
  annotations: { argocd.argoproj.io/sync-wave: "-8" }
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "keycloak-role"
          serviceAccountRef:
            name: "vault-auth"

---
# 3. ExternalSecret for OAuth2 Proxy
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubble-oauth2-proxy-secrets
  namespace: kube-system
  annotations: { argocd.argoproj.io/sync-wave: "-7" }
spec:
  refreshInterval: "15s"
  secretStoreRef: { name: vault-backend, kind: SecretStore }
  target:
    name: oauth2-proxy-hubble
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef:
        key: oauth2-proxy
        property: client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client-secret
      remoteRef:
        key: oauth2-proxy
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy
        property: cookie_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
