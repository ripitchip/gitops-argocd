apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy-protected
  namespace: notifications
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ntfy.foobarbaz.fr
      secretName: ntfy-tls
  rules:
    - host: ntfy.foobarbaz.fr
      http:
        paths:
          # L'interface utilisateur passe par oauth2-proxy (Proxy Mode)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy-oauth2-proxy
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy-public
  namespace: notifications
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Priorité élevée pour bypasser l'oauth2-proxy sur les endpoints d'API
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ntfy.foobarbaz.fr
      secretName: ntfy-tls
  rules:
    - host: ntfy.foobarbaz.fr
      http:
        paths:
          # API pour l'application mobile (Direct vers ntfy)
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
          # Topic d'alertes (Direct vers ntfy)
          - path: /alertes-cluster
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
