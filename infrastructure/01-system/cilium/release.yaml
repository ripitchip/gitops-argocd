apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    chart: cilium
    repoURL: https://helm.cilium.io/
    targetRevision: 1.19.4
    helm:
      values: |
        hubble:
          enabled: true
          relay:
            enabled: true
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
          ui:
            enabled: true
            ingress:
              enabled: true
              className: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                cert-manager.io/cluster-issuer: "letsencrypt-prod"
              hosts:
                - hubble.foobarbaz.fr
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: hubble-ui
                      port:
                        number: 80
              tls:
                - secretName: hubble-ui-tls
                  hosts:
                    - hubble.foobarbaz.fr
            podSecurityContext:
              enabled: true
              runAsUser: 4321
              runAsGroup: 4321
              fsGroup: 4321
            securityContext:
              enabled: true
              runAsUser: 4321
              runAsGroup: 4321
              runAsNonRoot: true
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
        operator:
          clusterPoolIPv4PodCIDRList:
          - 10.244.0.0/16
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
