# 1. ServiceAccount for Vault Auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
# 2. SecretStore pointing to Vault
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "grafana-role"
          serviceAccountRef:
            name: "vault-auth"
---
# 3. Synchronize Grafana Secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets-sync
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: grafana
        property: admin_password
    - secretKey: admin-user
      remoteRef:
        key: grafana
        property: admin_user
