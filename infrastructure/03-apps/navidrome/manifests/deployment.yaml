apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 45249
        runAsGroup: 45249
        fsGroup: 45249
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download-lyrics-plugin
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              mkdir -p /data/plugins
              if [ ! -f /data/plugins/nd-lyrics.ndp ]; then
                curl -L -s -o /data/plugins/nd-lyrics.ndp https://github.com/J0R6IT0/navidrome-lyrics-plugin/releases/latest/download/nd-lyrics.ndp
              fi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: navidrome
          image: deluan/navidrome:0.62.0
          ports:
            - containerPort: 4533
              name: http
          env:
            - name: ND_DATAFOLDER
              value: "/data"
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_LOGLEVEL
              value: "debug"
            - name: ND_EXTAUTH_TRUSTEDSOURCES
              value: "0.0.0.0/0"
            - name: ND_EXTAUTH_USERHEADER
              value: "X-Auth-Request-Preferred-Username"
            - name: ND_ENABLEUSEREDITING
              value: "true"
            - name: ND_PLUGINS_ENABLED
              value: "true"
            - name: ND_PLUGINS_FOLDER
              value: "/data/plugins"
            - name: ND_PLUGINS_LOGLEVEL
              value: "debug"
            - name: ND_LYRICSPRIORITY
              value: ".lrc,nd-lyrics,embedded"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data-pvc
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music-pvc
