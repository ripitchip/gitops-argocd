apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden
  namespace: linkwarden
  labels:
    app: linkwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkwarden
  template:
    metadata:
      labels:
        app: linkwarden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 19447
        runAsGroup: 19447
        fsGroup: 19447
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: ghcr.io/linkwarden/linkwarden:v2.14.1
          command: ["sh", "-c", "chown -R 19447:19447 /data/data && mkdir -p /tmp/ms-playwright && (cp -rp /root/.cache/ms-playwright/. /tmp/ms-playwright/ || cp -rp /home/node/.cache/ms-playwright/. /tmp/ms-playwright/ || true) && chown -R 19447:19447 /tmp/ms-playwright"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data/data
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
        - name: linkwarden
          image: ghcr.io/linkwarden/linkwarden:v2.14.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 19447
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: linkwarden-secrets
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkwarden-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              value: "https://link.foobarbaz.fr"
            - name: COREPACK_HOME
              value: "/tmp/corepack"
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: "/tmp/ms-playwright"
            - name: NEXT_PUBLIC_KEYCLOAK_ENABLED
              value: "true"
            - name: KEYCLOAK_ISSUER
              value: "https://auth.foobarbaz.fr/realms/foobarbaz"
            - name: KEYCLOAK_CLIENT_ID
              value: "linkwarden"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkwarden-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: MEILI_HOST
              value: "http://linkwarden-meilisearch:7700"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: linkwarden-secrets
                  key: MEILI_MASTER_KEY
          ports:
            - containerPort: 3000
              name: http

          volumeMounts:
            - name: data
              mountPath: /data/data
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /data/apps/web/.next/cache
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linkwarden-data-pvc
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
