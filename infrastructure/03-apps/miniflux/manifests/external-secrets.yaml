apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: miniflux
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: miniflux
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "miniflux-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-secrets-sync
  namespace: miniflux
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: miniflux-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URL: "postgres://miniflux:{{ .db_password }}@miniflux-postgres:5432/miniflux?sslmode=disable"
        DB_PASSWORD: "{{ .db_password }}"
        OAUTH2_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        ADMIN_USERNAME: "{{ .admin_username }}"
        ADMIN_PASSWORD: "{{ .admin_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: miniflux-secrets
        property: db-password
    - secretKey: oidc_client_secret
      remoteRef:
        key: miniflux-secrets
        property: oidc-client-secret
    - secretKey: admin_username
      remoteRef:
        key: miniflux-secrets
        property: admin-username
    - secretKey: admin_password
      remoteRef:
        key: miniflux-secrets
        property: admin-password
