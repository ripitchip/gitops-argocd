apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: default
  source:
    repoURL: "https://github.com/we-promise/sure.git"
    targetRevision: main
    path: charts/sure
    helm:
      releaseName: sure
      values: |
        image:
          tag: 0.7.3

        rails:
          existingSecret: sure-secrets
          encryptionEnv:
            enabled: false
          settings:
            SELF_HOSTED: "true"
            ONBOARDING_STATE: "open"
            AI_DEBUG_MODE: "false"
          extraEnv:
            APP_DOMAIN: budget.foobarbaz.fr
            RAILS_ASSUME_SSL: "true"
            WEBAUTHN_RP_ID: foobarbaz.fr
            WEBAUTHN_ALLOWED_ORIGINS: https://budget.foobarbaz.fr
            EXCHANGE_RATE_PROVIDER: yahoo_finance
            SECURITIES_PROVIDER: yahoo_finance
            OPENAI_URI_BASE: "http://ollama.ai.svc.cluster.local:11434/v1"
            OPENAI_ACCESS_TOKEN: "ollama-local"
            OPENAI_MODEL: "gemma4:e4b-it-q8_0"
            LLM_CONTEXT_WINDOW: "8192"
            OPENAI_REQUEST_TIMEOUT: "180"
            ASSISTANT_MAX_TOOL_CALL_ITERATIONS: "2"
            AI_RESPONSE_TIMEOUT: "720"
            ENABLE_AI_CHATS: "true"
          extraEnvVars:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sure-secrets
                  key: DATABASE_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sure-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sure-secrets
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: sure-secrets
                  key: OIDC_ISSUER
            - name: OIDC_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: sure-secrets
                  key: OIDC_REDIRECT_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sure-secrets
                  key: REDIS_URL

        cnpg:
          enabled: false
          cluster:
            enabled: false

        redisOperator:
          enabled: false
          managed:
            enabled: false

        redisSimple:
          enabled: false

        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: budget.foobarbaz.fr
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - budget.foobarbaz.fr
              secretName: sure-tls

        web:
          replicas: 1
          extraInitContainers:
            - name: wait-for-postgres
              image: busybox:1.36
              command:
                - sh
                - -c
                - until nc -z sure-postgres.sure.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: wait-for-redis
              image: busybox:1.36
              command:
                - sh
                - -c
                - until nc -z sure-redis-local.sure.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          extraVolumes:
            - name: sure-storage
              persistentVolumeClaim:
                claimName: sure-storage-pvc
          extraVolumeMounts:
            - name: sure-storage
              mountPath: /rails/storage
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        worker:
          replicas: 1
          extraInitContainers:
            - name: wait-for-postgres
              image: busybox:1.36
              command:
                - sh
                - -c
                - until nc -z sure-postgres.sure.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            - name: wait-for-redis
              image: busybox:1.36
              command:
                - sh
                - -c
                - until nc -z sure-redis-local.sure.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          extraVolumes:
            - name: sure-storage
              persistentVolumeClaim:
                claimName: sure-storage-pvc
          extraVolumeMounts:
            - name: sure-storage
              mountPath: /rails/storage
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        migrations:
          strategy: job
          job:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
  destination:
    server: "https://kubernetes.default.svc"
    namespace: sure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
