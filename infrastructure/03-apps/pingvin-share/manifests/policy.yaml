apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: pingvin-share-isolation
  namespace: pingvin-share
spec:
  endpointSelector:
    matchLabels:
      app: pingvin-share
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
            "k8s:app.kubernetes.io/name": traefik
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
