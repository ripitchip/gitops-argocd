apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "opencloud-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-secrets-sync
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: opencloud-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        IDM_ADMIN_PASSWORD: "{{ .admin_password }}"
        CALSHARE_PROXY_SECRET: "{{ .calshare_proxy_secret }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: opencloud-secrets
        property: admin-password
    # Jeton partagé proxy OpenCloud <-> sidecar calshare (voir radicale.yaml), pas un mot
    # de passe utilisateur - regroupé ici plutôt qu'un nouveau path Vault à part.
    - secretKey: calshare_proxy_secret
      remoteRef:
        key: opencloud-secrets
        property: calshare-proxy-secret
