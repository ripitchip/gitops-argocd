apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 24484
        runAsGroup: 24484
        fsGroup: 24484
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.1
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ai.svc.cluster.local:11434"
            - name: WEBUI_URL
              value: "https://ai.foobarbaz.fr"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: webui-secret-key
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: "Keycloak"
            - name: OAUTH_CLIENT_ID
              value: "open-webui"
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: oauth-client-secret
            - name: OPENID_PROVIDER_URL
              value: "https://auth.foobarbaz.fr/realms/foobarbaz/.well-known/openid-configuration"
            - name: OPENID_REDIRECT_URI
              value: "https://ai.foobarbaz.fr/oauth/oidc/callback"
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: ENABLE_OAUTH_ID_TOKEN_COOKIE
              value: "false"
            - name: ENABLE_PROFILE_IMAGE_URL_FORWARDING
              value: "false"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data-volume
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: open-webui-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai
  labels:
    app: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
