apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: stirling-pdf-isolation
  namespace: stirling-pdf
spec:
  endpointSelector:
    matchLabels:
      app: stirling-pdf
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY