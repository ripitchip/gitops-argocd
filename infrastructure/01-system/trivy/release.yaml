apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://aquasecurity.github.io/helm-charts/'
    chart: trivy-operator
    targetRevision: 0.32.1
    helm:
      values: |
        targetNamespaces: ""
        excludeNamespaces: "kube-*,argo*,trivy-system"
        
        trivy:
          ignoreUnfixed: true
          # Skip problematic checks globally
          skipCheckIDs: "AVD-KSV-0117,KSV117,AVD-KSV-0012,KSV012"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi

        operator:
          # Limit concurrency to avoid "database lock" errors
          scanJobsConcurrentLimit: 3
          scanJobTimeout: 15m
          clusterComplianceEnabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi

        trivyOperator:
          scanJobTolerations:
            - operator: Exists
          scanJobPodTemplatePodSecurityContext:
            runAsNonRoot: true
            runAsUser: 10000
            fsGroup: 10000
          scanJobPodTemplateContainerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
          # Large memory limit for heavy images (Keycloak, etc)
          scanJobResources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 4Gi

        nodeCollector:
          tolerations:
            - operator: Exists
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        serviceMonitor:
          enabled: false
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          fsGroup: 65534
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
