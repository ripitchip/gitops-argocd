apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    chart: cilium
    repoURL: https://helm.cilium.io/
    targetRevision: 1.19.4
    helm:
      values: |
        annotations:
          trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
        commonAnnotations:
          trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
        hubble:
          enabled: true
          relay:
            enabled: true
            annotations:
              trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
            podAnnotations:
              trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
        envoy:
          annotations:
            trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
          podAnnotations:
            trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        ui:
          enabled: false
        operator:
          annotations:
            trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
          podAnnotations:
            trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
          clusterPoolIPv4PodCIDRList:
          - 10.244.0.0/16
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        podAnnotations:
          trivy-operator.aquasecurity.github.io/trivy-ignore-checks: "AVD-KSV-0037,AVD-KSV-0009"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
