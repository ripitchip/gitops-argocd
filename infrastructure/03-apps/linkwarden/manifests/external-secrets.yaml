apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: linkwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: linkwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "linkwarden-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-secrets-sync
  namespace: linkwarden
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: linkwarden-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URL: "postgresql://linkwarden:{{ .db_password | urlquery }}@linkwarden-postgres:5432/linkwarden"
        DB_PASSWORD: "{{ .db_password }}"
        NEXTAUTH_SECRET: "{{ .nextauth_secret }}"
        KEYCLOAK_CLIENT_SECRET: "{{ .keycloak_client_secret }}"
        MEILI_MASTER_KEY: "{{ .meili_master_key }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: linkwarden-secrets
        property: db-password
    - secretKey: nextauth_secret
      remoteRef:
        key: linkwarden-secrets
        property: nextauth-secret
    - secretKey: keycloak_client_secret
      remoteRef:
        key: linkwarden-secrets
        property: keycloak-client-secret
    - secretKey: meili_master_key
      remoteRef:
        key: linkwarden-secrets
        property: meili-master-key



