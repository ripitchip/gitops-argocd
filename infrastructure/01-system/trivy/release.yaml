apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: "https://aquasecurity.github.io/helm-charts/"
    chart: trivy-operator
    targetRevision: 0.32.1
    helm:
      values: |
        # Root level parameters for version 0.32.1
        targetNamespaces: ""
        excludeNamespaces: "kube-*,argo*,trivy-system"

        image:
          tag: "0.30.1"

        operator:
          # Limit concurrency to avoid "database lock" errors
          scanJobsConcurrentLimit: 3
          scanJobTimeout: 15m
          clusterComplianceEnabled: false
          # Explicit limits for the operator pod itself (Kyverno compliance)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi

        trivy:
          ignoreUnfixed: true
          ignoreFile: "misconfigurations:\n  - id: AVD-KSV-0017\n    statement: \"Falco requires privileged access or specific capabilities to monitor system calls via kernel module or eBPF.\""
          ignoreFileName: ".trivyignore.yaml"
          # Resources for the SCAN JOBS (Crucial for OOMKilled)
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 4Gi

        trivyOperator:
          scanJobTolerations:
            - operator: Exists
          scanJobPodTemplatePodSecurityContext:
            runAsNonRoot: true
            runAsUser: 10000
            fsGroup: 10000
          scanJobPodTemplateContainerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000

        serviceMonitor:
          enabled: false

        # Global operator security context
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          fsGroup: 65534
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
  destination:
    server: "https://kubernetes.default.svc"
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
