# 1. ExternalSecret for OAuth2 Proxy secrets in kube-system
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubble-oauth2-proxy-secrets
  namespace: kube-system
  annotations: { argocd.argoproj.io/sync-wave: "-7" }
spec:
  refreshInterval: "15s"
  secretStoreRef: { name: vault-backend, namespace: auth, kind: ClusterSecretStore }
  target:
    name: oauth2-proxy-hubble
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: oauth2-proxy, property: client_id }
    - secretKey: client-secret
      remoteRef: { key: oauth2-proxy, property: client_secret }
    - secretKey: cookie-secret
      remoteRef: { key: oauth2-proxy, property: cookie_secret }

---
# 2. Deployment: OAuth2 Proxy in front of Hubble UI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-hubble
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: oauth2-proxy-hubble
  template:
    metadata:
      labels:
        k8s-app: oauth2-proxy-hubble
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.foobarbaz.fr/realms/master
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --upstream=http://hubble-ui.kube-system.svc.cluster.local:80
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --set-authorization-header=true
            - --pass-access-token=true
            - --redirect-url=https://hubble.foobarbaz.fr/oauth2/callback
            - --insecure-oidc-skip-issuer-verification=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-hubble
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-hubble
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-hubble
                  key: cookie-secret
          ports:
            - containerPort: 4180

---
# 3. Service for OAuth2 Proxy
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-hubble
  namespace: kube-system
spec:
  selector:
    k8s-app: oauth2-proxy-hubble
  ports:
    - port: 80
      targetPort: 4180
  type: ClusterIP

---
# 4. Ingress pointing to OAuth2 Proxy
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui-ingress
  namespace: kube-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  rules:
  - host: hubble.foobarbaz.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy-hubble
            port:
              number: 80
  tls:
  - hosts:
    - hubble.foobarbaz.fr
    secretName: hubble-ui-tls
