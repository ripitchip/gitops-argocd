apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: kutt
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limit, namespace: kutt }
spec: { rateLimit: { average: 80, burst: 160 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: compress, namespace: kutt }
spec: { compress: {} }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: public-chain, namespace: kutt }
spec:
  chain:
    middlewares:
      - name: security-headers
      - name: rate-limit
      - name: compress
