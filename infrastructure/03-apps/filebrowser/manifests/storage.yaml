apiVersion: v1
kind: PersistentVolume
metadata:
  name: filebrowser-config-pv
  annotations: { argocd.argoproj.io/sync-wave: "-5" }
spec:
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions: ["nfsvers=4.1", "hard"]
  nfs:
    server: "10.0.60.10"
    path: "/mnt/data/k8s-cluster/pvc-volumes/filebrowser-config"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-config-pvc
  namespace: filebrowser
  annotations: { argocd.argoproj.io/sync-wave: "-5" }
spec:
  storageClassName: truenas-nfs
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
  volumeName: filebrowser-config-pv
---
# Same backing NFS export as jellyfin-media-pv, so File Browser reads and
# writes directly into the library Jellyfin already scans (movies/series/anime/documentaries).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: filebrowser-media-pv
  annotations: { argocd.argoproj.io/sync-wave: "-5" }
spec:
  capacity: { storage: 100Gi }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions: ["nfsvers=4.1", "hard"]
  nfs:
    server: "10.0.60.10"
    path: "/mnt/data/k8s-cluster/pvc-volumes/jellyfin-media"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-media-pvc
  namespace: filebrowser
  annotations: { argocd.argoproj.io/sync-wave: "-5" }
spec:
  storageClassName: truenas-nfs
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 100Gi } }
  volumeName: filebrowser-media-pv
