apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    io.cilium/lb-ipam-ips: "10.0.50.200"
spec:
  ingressClassName: cilium
  rules:
    - host: argocd.foobarbaz.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argo-cd-argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd.foobarbaz.fr
      secretName: argocd-server-tls
