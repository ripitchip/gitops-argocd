# Content-Security-Policy d'OpenCloud : valeurs par défaut + Keycloak
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-csp
  namespace: opencloud
data:
  csp.yaml: |
    directives:
      child-src:
        - '''self'''
      connect-src:
        - '''self'''
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'https://auth.foobarbaz.fr/'
        - 'https://update.opencloud.eu/'
        - 'https://tile.openstreetmap.org/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        - 'https://embed.diagrams.net/'
        - 'https://docs.opencloud.eu'
        - 'https://auth.foobarbaz.fr/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'https://tile.openstreetmap.org/'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'https://auth.foobarbaz.fr/'
      style-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'blob:'
      worker-src:
        - "'self'"
        - 'blob:'
