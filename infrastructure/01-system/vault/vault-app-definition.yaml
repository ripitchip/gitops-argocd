apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: "https://github.com/ripitchip/gitops-argocd.git"
    targetRevision: HEAD
    path: infrastructure/01-system/vault/manifests
  destination:
    server: "https://kubernetes.default.svc"
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
