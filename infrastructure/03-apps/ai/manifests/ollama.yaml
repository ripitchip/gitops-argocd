apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
  labels:
    app: ollama
spec:
  # Temporarily stopped while Nightingale performs its initial GPU-accelerated
  # library analysis. Set back to 1 when the batch is complete.
  replicas: 0
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 24484
        runAsGroup: 24484
        fsGroup: 24484
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: ollama/ollama:0.31.2
          env:
            - name: OLLAMA_MODELS
              value: "/models"
            - name: HOME
              value: "/root"
          ports:
            - containerPort: 11434
              name: http
          volumeMounts:
            - name: models-volume
              mountPath: /models
            - name: root-volume
              mountPath: /root
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8000m"
              memory: "16Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: models-volume
          persistentVolumeClaim:
            claimName: ollama-models-pvc
        - name: root-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
