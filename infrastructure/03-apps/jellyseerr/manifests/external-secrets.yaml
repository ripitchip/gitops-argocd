apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: jellyseerr
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: jellyseerr
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "jellyseerr-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyseerr-secrets-sync
  namespace: jellyseerr
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: jellyseerr-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JELLYFIN_ADMIN_USERNAME
      remoteRef:
        key: jellyseerr-secrets
        property: jellyfin-admin-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: JELLYFIN_ADMIN_PASSWORD
      remoteRef:
        key: jellyseerr-secrets
        property: jellyfin-admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
