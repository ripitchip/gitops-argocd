apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: stirling-pdf
  namespace: pdf
  labels:
    app.kubernetes.io/name: stirling-pdf
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stirling-pdf
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 14852
        runAsGroup: 14852
        fsGroup: 14852
      tolerations:
        - operator: Exists
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:2.11.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SECURITY_ENABLELOGIN
              value: "false"
            - name: LANGS
              value: "en_GB"
            - name: HOME
              value: "/tmp"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 3Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - name: tessdata-volume
              mountPath: /usr/share/tessdata
            - name: configs-volume
              mountPath: /configs
            - name: logs-volume
              mountPath: /logs
            - name: pipeline-volume
              mountPath: /pipeline
      volumes:
        - name: tessdata-volume
          emptyDir: {}
        - name: configs-volume
          emptyDir: {}
        - name: logs-volume
          emptyDir: {}
        - name: pipeline-volume
          emptyDir: {}
