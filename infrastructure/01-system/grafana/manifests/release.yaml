apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: grafana
    targetRevision: 8.5.1
    helm:
      values: |
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password
        grafana.ini:
          server:
            root_url: https://grafana.foobarbaz.fr
          smtp:
            enabled: true
            host: mailrise.notifications.svc.cluster.local:25
            from_address: grafana@foobarbaz.fr
            from_name: Grafana
            startTLS_policy: NoStartTLS
          auth.generic_oauth:
            enabled: true
            name: Keycloak
            allow_sign_up: true
            client_id: grafana
            client_secret: $__file{/etc/grafana/secrets/oidc-client-secret}
            scopes: openid profile email groups
            auth_url: https://auth.foobarbaz.fr/realms/foobarbaz/protocol/openid-connect/auth
            token_url: https://auth.foobarbaz.fr/realms/foobarbaz/protocol/openid-connect/token
            api_url: https://auth.foobarbaz.fr/realms/foobarbaz/protocol/openid-connect/userinfo
            role_attribute_path: contains(groups[*], 'grafana-admin') && 'Admin' || 'Viewer'
        extraSecretMounts:
          - name: grafana-oidc-secret
            mountPath: /etc/grafana/secrets/oidc-client-secret
            subPath: oidc-client-secret
            secretName: grafana-admin-credentials
            readOnly: true
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Mimir
                type: prometheus
                url: http://mimir-nginx.mimir.svc.cluster.local/prometheus
                access: proxy
                isDefault: true
                jsonData:
                  prometheusType: Mimir
              - name: Loki
                type: loki
                url: http://loki-gateway.loki.svc.cluster.local
                access: proxy
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: "(?:trace_id|traceID|tid)=(\\w+)"
                      name: TraceID
                      url: "$${__value.raw}"
              - name: Tempo
                type: tempo
                url: http://tempo.tempo.svc.cluster.local:3100
                access: proxy
                uid: tempo

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            falcosidekick:
              gnetId: 17319
              revision: 1
              datasource: Loki

        alerting:
          contactpoints.yaml:
            apiVersion: 1
            contactPoints:
              - orgId: 1
                name: gotify
                receivers:
                  - uid: gotify-mailrise
                    type: email
                    settings:
                      addresses: grafana-alerts@mailrise.xyz
                      singleEmail: true
          policies.yaml:
            apiVersion: 1
            policies:
              - orgId: 1
                receiver: gotify
                group_by:
                  - alertname
                  - grafana_folder
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 472
          fsGroup: 472
        containerSecurityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        persistence:
          type: pvc
          enabled: true
          existingClaim: grafana-pvc
        ingress:
          enabled: false # Managed explicitly if required, disabled by default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
