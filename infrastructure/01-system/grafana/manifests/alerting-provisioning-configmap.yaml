apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-provisioning
  namespace: grafana
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: gotify
        receivers:
          - uid: gotify-mailrise
            type: email
            settings:
              addresses: grafana-alerts@mailrise.xyz
              singleEmail: true
              subject: '{{ template "falco.gotify.subject" . }}'
              message: '{{ template "falco.gotify.message" . }}'
  templates.yaml: |
    apiVersion: 1
    templates:
      - orgId: 1
        name: falco-gotify
        template: |
          {{ define "falco.gotify.subject" -}}
          {{- if .Alerts.Firing -}}🚨 FALCO CRITICAL — {{ len .Alerts.Firing }} | {{ range .Alerts.Firing }}{{ .Labels.alertname }} | {{ .Annotations.summary }} | {{ .Annotations.description }}{{ end }}{{- else -}}✅ FALCO RÉSOLU — {{ len .Alerts.Resolved }} | {{ range .Alerts.Resolved }}{{ .Labels.alertname }} | {{ .Annotations.summary }}{{ end }}{{- end -}}
          {{- end }}

          {{ define "falco.gotify.message" -}}
          {{- if .Alerts.Firing -}}🚨 FALCO CRITICAL | {{ range .Alerts.Firing -}}Règle: {{ .Labels.alertname }} | Sévérité: {{ .Labels.severity }} | Résumé: {{ .Annotations.summary }} | Détail: {{ .Annotations.description }} | Début: {{ .StartsAt }}{{ end }} | Vérifier: https://grafana.foobarbaz.fr/alerting/list{{- else -}}✅ FALCO RÉSOLU | {{ range .Alerts.Resolved -}}Règle: {{ .Labels.alertname }} | Résumé: {{ .Annotations.summary }} | Résolue: {{ .EndsAt }}{{ end }}{{- end }}
          {{- end }}
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: gotify
        group_by:
          - alertname
          - grafana_folder
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1m
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: falco-critical-events
        folder: Security
        interval: 1m
        rules:
          - uid: falco-critical-mailrise
            title: Falco Critical event
            condition: B
            for: 0s
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Alerte Falco Critical"
              description: "Un ou plusieurs événements Falco Critical ont été détectés dans les 5 dernières minutes."
            labels:
              severity: critical
              source: falco
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: Loki
                model:
                  datasource:
                    type: loki
                    uid: Loki
                  editorMode: code
                  expr: sum(count_over_time({priority="Critical"}[5m]))
                  queryType: instant
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: threshold
