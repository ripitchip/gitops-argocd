apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: alloy-security
  namespace: alloy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  ingress:
    # Allow Alloy to talk to its own UI/Metrics
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
  egress:
    # 1. MONITORING MANDATE: Alloy must reach any pod/service to scrape metrics
    - toEntities:
        - cluster
        - host
    # 2. EXTERNAL MANDATE: Reach world for FQDN scraping and telemetry (e.g., stats.grafana.org)
    - toEntities:
        - world
    # 3. DNS L7: Required for Cilium to correlate FQDNs with IPs
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 4. API SERVER: Required for discovery
    - toEntities:
        - kube-apiserver
