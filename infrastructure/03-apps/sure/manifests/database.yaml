apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-postgres
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app: sure-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sure-postgres
  template:
    metadata:
      labels:
        app: sure-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 15432
        runAsGroup: 15432
        fsGroup: 15432
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/lib/postgresql/data/pgdata && chown -R 15432:15432 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: sure
            - name: POSTGRES_DB
              value: sure
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sure-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 15432
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: sure-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sure-postgres
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    app: sure-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
