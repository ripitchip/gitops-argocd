# Routes supplémentaires du proxy OpenCloud vers Radicale (calendrier/contacts),
# voir radicale.yaml. "additional_policies" est une clé indépendante de la
# politique de routage par défaut générée par `opencloud init` (proxy.policies),
# donc elle vient s'ajouter sans l'écraser. Mergée (via yq, voir app.yaml) sous
# la clé "proxy:" déjà présente dans opencloud.yaml, pour les mêmes raisons que
# role-mapping.yaml (pas de concaténation simple possible).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-calendar-proxy
  namespace: opencloud
data:
  caldav_routes.yaml: |
    proxy:
      additional_policies:
        - name: default
          routes:
            - endpoint: /caldav/
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /caldav
            - endpoint: /.well-known/caldav
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /caldav
            - endpoint: /carddav/
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /carddav
            - endpoint: /.well-known/carddav
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /carddav
