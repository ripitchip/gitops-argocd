# --- 1. GLOBAL ISOLATION (Namespace: pass) ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pass-security-core
  namespace: pass
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: {} }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
      ports: [{ protocol: TCP, port: 80 }]
  egress:
    - to: [{ podSelector: {} }]
    # DNS Access
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    # Vault Access
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: vault }
      ports: [{ protocol: TCP, port: 8200 }]
    - to:
        - ipBlock: { cidr: 10.96.0.0/12 }
      ports:
        - { protocol: TCP, port: 443 }