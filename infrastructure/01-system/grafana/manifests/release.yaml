apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: grafana
    targetRevision: 8.5.1
    helm:
      values: |
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password
        grafana.ini:
          server:
            root_url: https://grafana.foobarbaz.fr
          smtp:
            enabled: true
            host: mailrise.notifications.svc.cluster.local:25
            from_address: grafana@foobarbaz.fr
            from_name: Grafana
            startTLS_policy: NoStartTLS
          auth.generic_oauth:
            enabled: true
            name: Keycloak
            allow_sign_up: true
            client_id: grafana
            client_secret: $__file{/etc/grafana/secrets/oidc-client-secret}
            scopes: openid profile email groups
            auth_url: https://auth.foobarbaz.fr/realms/foobarbaz/protocol/openid-connect/auth
            token_url: https://auth.foobarbaz.fr/realms/foobarbaz/protocol/openid-connect/token
            api_url: https://auth.foobarbaz.fr/realms/foobarbaz/protocol/openid-connect/userinfo
            role_attribute_path: contains(groups[*], 'grafana-admin') && 'Admin' || 'Viewer'
        extraSecretMounts:
          - name: grafana-oidc-secret
            mountPath: /etc/grafana/secrets/oidc-client-secret
            subPath: oidc-client-secret
            secretName: grafana-admin-credentials
            readOnly: true
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Mimir
                type: prometheus
                url: http://mimir-nginx.mimir.svc.cluster.local/prometheus
                access: proxy
                isDefault: true
                jsonData:
                  prometheusType: Mimir
              - name: Loki
                type: loki
                uid: Loki
                url: http://loki-gateway.loki.svc.cluster.local
                access: proxy
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: "(?:trace_id|traceID|tid)=(\\w+)"
                      name: TraceID
                      url: "$${__value.raw}"
              - name: Tempo
                type: tempo
                url: http://tempo.tempo.svc.cluster.local:3100
                access: proxy
                uid: tempo

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboardsConfigMaps:
          default: "falco-dashboard-configmap"

        alerting:
          contactpoints.yaml:
            apiVersion: 1
            contactPoints:
              - orgId: 1
                name: gotify
                receivers:
                  - uid: gotify-mailrise
                    type: email
                    settings:
                      addresses: grafana-alerts@mailrise.xyz
                      singleEmail: true
                      subject: '{{ template "falco.gotify.subject" . }}'
                      message: '{{ template "falco.gotify.message" . }}'
          templates.yaml:
            apiVersion: 1
            templates:
              - orgId: 1
                name: falco-gotify
                template: |
                  {{ define "falco.gotify.subject" -}}
                  {{- if .Alerts.Firing -}}🚨 CRITICAL Falco — {{ len .Alerts.Firing }} alerte(s){{- else -}}✅ Falco — {{ len .Alerts.Resolved }} alerte(s) résolue(s){{- end -}}
                  {{- end }}

                  {{ define "falco.gotify.message" -}}
                  {{- if .Alerts.Firing }}🚨 ALERTE CRITIQUE FALCO

                  Une activité critique a été détectée dans le cluster Kubernetes.

                  {{ range .Alerts.Firing -}}
                  Règle : {{ .Labels.alertname }}
                  Sévérité : {{ .Labels.severity }}
                  Résumé : {{ .Annotations.summary }}
                  Détail : {{ .Annotations.description }}
                  Début : {{ .StartsAt }}
                  {{ end -}}

                  Action : vérifier l’événement Falco dans Grafana.
                  https://grafana.foobarbaz.fr
                  {{- else }}✅ ALERTE FALCO RÉSOLUE

                  L’événement critique ne se produit plus.

                  {{ range .Alerts.Resolved -}}
                  Règle : {{ .Labels.alertname }}
                  Résumé : {{ .Annotations.summary }}
                  Résolue le : {{ .EndsAt }}
                  {{ end -}}
                  {{- end }}
                  {{- end }}
          policies.yaml:
            apiVersion: 1
            policies:
              - orgId: 1
                receiver: gotify
                group_by:
                  - alertname
                  - grafana_folder
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
          rules.yaml:
            apiVersion: 1
            groups:
              - orgId: 1
                name: falco-critical-events
                folder: Security
                interval: 1m
                rules:
                  - uid: falco-critical-mailrise
                    title: Falco Critical event
                    condition: B
                    for: 0s
                    noDataState: OK
                    execErrState: Error
                    annotations:
                      summary: "Alerte Falco Critical"
                      description: "Un ou plusieurs événements Falco Critical ont été détectés dans les 5 dernières minutes."
                    labels:
                      severity: critical
                      source: falco
                    data:
                      - refId: A
                        relativeTimeRange:
                          from: 300
                          to: 0
                        datasourceUid: Loki
                        model:
                          datasource:
                            type: loki
                            uid: Loki
                          editorMode: code
                          expr: sum(count_over_time({priority="Critical"}[5m]))
                          queryType: instant
                          refId: A
                      - refId: B
                        relativeTimeRange:
                          from: 300
                          to: 0
                        datasourceUid: __expr__
                        model:
                          conditions:
                            - evaluator:
                                params:
                                  - 0
                                type: gt
                              operator:
                                type: and
                              query:
                                params:
                                  - A
                              reducer:
                                params: []
                                type: last
                              type: query
                          datasource:
                            type: __expr__
                            uid: __expr__
                          expression: A
                          reducer: last
                          refId: B
                          type: threshold

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 472
          fsGroup: 472
        containerSecurityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        persistence:
          type: pvc
          enabled: true
          existingClaim: grafana-pvc
        ingress:
          enabled: false # Managed explicitly if required, disabled by default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
