# --- POSTGRES (Service + Deployment) ---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: auth }
spec:
  selector: { app: postgres }
  ports: [{ protocol: TCP, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: auth }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: postgres
          image: mirror.gcr.io/postgres:17
          env:
            - { name: POSTGRES_USER, value: "keycloak" }
            - { name: POSTGRES_DB, value: "keycloak" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-passwords, key: admin-password } }
          ports: [{ name: postgres, containerPort: 5432 }]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: v2-vault # Force une nouvelle init avec le mot de passe Vault
      volumes:
        - name: postgres-data
          persistentVolumeClaim: { claimName: keycloak-db-pvc-static }
---
# --- OPENLDAP (Service + Deployment) ---
apiVersion: v1
kind: Service
metadata: { name: openldap, namespace: auth }
spec:
  selector: { app: openldap }
  ports:
    - { name: ldap, port: 389, targetPort: 1389 }
    - { name: ldaps, port: 636, targetPort: 1636 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: openldap, namespace: auth }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: openldap } }
  template:
    metadata: { labels: { app: openldap } }
    spec:
      securityContext: { fsGroup: 1001 }
      containers:
        - name: openldap
          image: bitnamilegacy/openldap:2.6.10
          env:
            - { name: LDAP_ROOT, value: "dc=home,dc=local" }
            - { name: LDAP_ADMIN_USERNAME, value: "admin" }
            - name: LDAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: ldap-passwords, key: admin-password } }
            - { name: ORG_GROUPS_ENABLED, value: "true" }
          volumeMounts: [{ name: ldap-data, mountPath: /bitnami/openldap }]
      volumes:
        - name: ldap-data
          persistentVolumeClaim: { claimName: openldap-pvc-static }
---
# --- KEYCLOAK (Service + StatefulSet) ---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: auth }
spec:
  selector: { app: keycloak }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: keycloak, namespace: auth }
spec:
  serviceName: keycloak
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -vz postgres.auth.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.1
          args: ["start", "--http-enabled=true"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: "admin" }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: keycloak-passwords, key: admin-password } } }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: "xforwarded" }
            - { name: KC_HOSTNAME, value: "auth.foobarbaz.fr" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_CACHE, value: "local" }
            - { name: KC_DB, value: "postgres" }
            - { name: KC_DB_URL_HOST, value: "postgres" }
            - { name: KC_DB_URL_DATABASE, value: "keycloak" }
            - { name: KC_DB_USERNAME, value: "keycloak" }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: keycloak-passwords, key: admin-password } } }
          volumeMounts:
            - name: keycloak-providers-volume
              mountPath: /opt/keycloak/providers
      volumes:
        - name: keycloak-providers-volume
          persistentVolumeClaim: { claimName: keycloak-providers-pvc-static }
---
# --- INGRESS ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: auth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: "letsencrypt-prod" 
spec:
  ingressClassName: traefik
  tls: [{ hosts: ["auth.foobarbaz.fr"], secretName: keycloak-cert-tls }]
  rules:
    - host: "auth.foobarbaz.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: keycloak, port: { number: 8080 } }
