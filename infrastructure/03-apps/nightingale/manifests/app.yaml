apiVersion: v1
kind: Service
metadata:
  name: nightingale
  namespace: nightingale
spec:
  selector:
    app: nightingale
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightingale
  namespace: nightingale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nightingale
  template:
    metadata:
      labels:
        app: nightingale
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 12046
        runAsGroup: 32280
        fsGroup: 32280
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nightingale
          image: razzaru/nightingale:0.9.0-cuda
          env:
            - name: NIGHTINGALE_BIND
              value: "0.0.0.0:8080"
            - name: NIGHTINGALE_DATA_PATH
              value: /data
            - name: NIGHTINGALE_LIBRARY_PATH
              value: /songs
            - name: UV_CONSTRAINT
              value: /etc/nightingale-python/constraints.txt
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: UV_LINK_MODE
              value: copy
            # Nightingale's audio separation and Whisper pipelines are heavily
            # CPU-bound when CUDA is unavailable. Keep the native libraries on
            # the same concurrency budget as the container CPU limit.
            - name: OMP_NUM_THREADS
              value: "12"
            - name: MKL_NUM_THREADS
              value: "12"
            - name: OPENBLAS_NUM_THREADS
              value: "12"
            - name: RAYON_NUM_THREADS
              value: "12"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 12046
            runAsGroup: 32280
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /songs
              readOnly: true
            - name: python-constraints
              mountPath: /etc/nightingale-python
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nightingale-data-pvc
        - name: music
          persistentVolumeClaim:
            claimName: nightingale-music-pvc
        - name: python-constraints
          configMap:
            name: nightingale-python-constraints
