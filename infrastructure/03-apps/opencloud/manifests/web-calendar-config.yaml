# config.json for the "web" service (not a key in opencloud.yaml, see WEB_UI_CONFIG_FILE
# in app.yaml which replaces its auto-generation). Mirrors the default content
# + "external_apps" for the calendar extension (files dropped by install-web-calendar).
# Update by hand if the web config changes (WEB_OPTION_*/WEB_OIDC_*, theme...).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-web-config
  namespace: opencloud
data:
  config.json: |
    {
      "server": "https://cloud.tomlab.fr/",
      "theme": "https://cloud.tomlab.fr/themes/opencloud/theme.json",
      "openIdConnect": {
        "metadata_url": "https://auth.foobarbaz.fr/realms/foobarbaz/.well-known/openid-configuration",
        "authority": "https://auth.foobarbaz.fr/realms/foobarbaz",
        "client_id": "web",
        "response_type": "code",
        "scope": "openid profile email"
      },
      "apps": ["files", "search", "text-editor", "pdf-viewer", "external", "admin-settings", "epub-reader", "preview", "app-store"],
      "external_apps": [
        { "id": "web-calendar", "path": "web/assets/apps/web-calendar/js/web-calendar.js" }
      ],
      "options": {
        "accountEditLink": { "href": "https://auth.foobarbaz.fr/realms/foobarbaz/account" },
        "contextHelpersReadMore": true,
        "tokenStorageLocal": true,
        "embed": {},
        "concurrentRequests": { "shares": {} }
      }
    }
