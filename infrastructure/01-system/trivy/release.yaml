apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://aquasecurity.github.io/helm-charts/'
    chart: trivy-operator
    targetRevision: 0.32.1
    helm:
      values: |
        targetNamespaces: ""
        excludeNamespaces: "kube-system,kube-public,kube-node-lease,argocd"
        
        trivy:
          ignoreUnfixed: true
          # Skip problematic checks globally
          skipCheckIDs: "AVD-KSV-0117,KSV117,AVD-KSV-0012,KSV012"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi

        operator:
          scanJobTimeout: 5m
          clusterComplianceEnabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi

        trivyOperator:
          scanJobTolerations:
            - operator: Exists
          scanJobPodTemplatePodSecurityContext:
            runAsNonRoot: true
            runAsUser: 10000
            fsGroup: 10000
          scanJobPodTemplateContainerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
          # Ensure scan jobs have resources for Kyverno compliance
          scanJobResources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi

        nodeCollector:
          tolerations:
            - operator: Exists
          # Ensure node collectors have resources for Kyverno compliance
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        serviceMonitor:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
