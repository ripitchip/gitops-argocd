apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: karakeep-security-headers
  namespace: linkwarden
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: karakeep-rate-limit, namespace: linkwarden }
spec: { rateLimit: { average: 60, burst: 120 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: karakeep-compress, namespace: linkwarden }
spec: { compress: {} }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: karakeep-public-chain, namespace: linkwarden }
spec:
  chain:
    middlewares:
      - name: karakeep-security-headers
      - name: karakeep-rate-limit
      - name: karakeep-compress
