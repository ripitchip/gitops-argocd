apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: mimir-distributed
    targetRevision: 5.3.0
    helm:
      values: |
        deploymentMode: monolithic
        mimir:
          structuredConfig:
            multitenancy_enabled: false
            common:
              storage:
                backend: filesystem
            blocks_storage:
              backend: filesystem
              filesystem:
                dir: /data/mimir/blocks
            alertmanager_storage:
              backend: filesystem
              filesystem:
                dir: /data/mimir/alerts
            ruler_storage:
              backend: filesystem
              filesystem:
                dir: /data/mimir/rules
        
        ingester:
          replicas: 1
        querier:
          replicas: 1
        distributor:
          replicas: 1

        # Security Context to comply with Kyverno policies
        mimir:
          podSecurityContext:
            runAsUser: 11985
            runAsGroup: 11985
            fsGroup: 11985
            runAsNonRoot: true
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 11985
        
        # Disable enterprise features if any
        mimir-continuous-test:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mimir
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
