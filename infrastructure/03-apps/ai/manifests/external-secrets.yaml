apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ai-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets-sync
  namespace: ai
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: open-webui-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: webui-secret-key
      remoteRef:
        key: open-webui-secrets
        property: webui-secret-key
    - secretKey: oauth-client-secret
      remoteRef:
        key: open-webui-secrets
        property: oauth-client-secret
