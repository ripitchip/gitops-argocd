apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: grafana
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: login-rate-limit, namespace: grafana }
spec: { rateLimit: { average: 30, burst: 60 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: public-chain, namespace: grafana }
spec:
  chain:
    middlewares:
      - name: security-headers
      - name: login-rate-limit
