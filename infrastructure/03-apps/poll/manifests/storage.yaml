apiVersion: v1
kind: PersistentVolume
metadata:
  name: poll-mongo-local-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: poll-local
  local:
    path: /var/lib/k8s-local/poll-mongo
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-04
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: poll-mongo-local-pvc
  namespace: poll
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  storageClassName: poll-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeName: poll-mongo-local-pv
