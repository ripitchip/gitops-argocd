apiVersion: v1
kind: PersistentVolume
metadata:
  name: falco-redis-pv-static
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions:
    - "nfsvers=4.1"
    - "hard"
  nfs:
    server: "10.0.60.10"
    path: "/mnt/data/k8s-cluster/pvc-volumes/falco-redis"
  claimRef:
    name: falco-helm-falcosidekick-ui-redis-data-falco-helm-falcosidekick-ui-redis-0
    namespace: falco

