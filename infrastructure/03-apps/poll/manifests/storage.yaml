apiVersion: v1
kind: PersistentVolume
metadata:
  name: poll-mongo-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: "10.0.60.10"
    path: "/mnt/data/k8s-cluster/pvc-volumes/poll-mongo"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: poll-mongo-pvc
  namespace: poll
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeName: poll-mongo-pv
