apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stirling-pdf
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: 'https://github.com/ripitchip/gitops-argocd.git'
    path: infrastructure/03-apps/pdf
    targetRevision: HEAD
    helm:
      values: |
        image:
          tag: "2.10.1"
        
        envs:
          - name: SERVER_PORT
            value: "8080"
          - name: SERVER_FORWARD_HEADERS_STRATEGY
            value: "native"
          - name: SYSTEM_BACKENDURL
            value: "https://pdf.foobarbaz.fr"
          - name: SECURITY_ENABLELOGIN
            value: "false"
          - name: HOME
            value: "/tmp"
          - name: DOCKER_ENABLE_CHOWN
            value: "false"
          - name: PATH
            value: "/usr/local/bin:/opt/java/openjdk/bin:/usr/bin:/bin:/usr/sbin:/sbin"

        deployment:
          annotations:
            argocd.argoproj.io/sync-wave: "5"
          extraVolumes:
            - name: tmp-volume
              emptyDir: {}
            - name: logs-volume
              emptyDir: {}
            - name: bin-volume
              emptyDir: {}
            - name: configs-volume
              emptyDir: {}
            - name: pipeline-volume
              emptyDir: {}
            - name: custom-files-volume
              emptyDir: {}
          extraVolumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: logs-volume
              mountPath: /logs
            - name: bin-volume
              mountPath: /usr/local/bin
            - name: configs-volume
              mountPath: /configs
            - name: pipeline-volume
              mountPath: /pipeline
            - name: custom-files-volume
              mountPath: /customFiles

        initContainers:
          - name: init-permissions
            image: "stirlingtools/stirling-pdf:2.10.1"
            securityContext:
              runAsUser: 3042
              runAsGroup: 3042
            command:
              - /bin/sh
              - -c
              - |
                mkdir -p /tmp/stirling-pdf /logs /configs /pipeline /customFiles
                # On copie les outils et on crée un wrapper pour 'id'
                cp -a /usr/local/bin/* /mnt/bin/
                cat <<'EOF' > /mnt/bin/id
                #!/bin/sh
                if [ "$1" = "-un" ]; then
                    /usr/bin/id -un 2>/dev/null || echo "stirlingpdfuser"
                    exit 0
                fi
                exec /usr/bin/id "$@"
                EOF
                chmod +x /mnt/bin/id
            volumeMounts:
              - name: tmp-volume
                mountPath: /tmp
              - name: logs-volume
                mountPath: /logs
              - name: bin-volume
                mountPath: /mnt/bin
              - name: configs-volume
                mountPath: /configs
              - name: pipeline-volume
                mountPath: /pipeline
              - name: custom-files-volume
                mountPath: /customFiles


        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"

        securityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 3042
          fsGroup: 3042
        
        containerSecurityContext:
          runAsUser: 3042
          runAsGroup: 3042

        service:
          externalPort: 80

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            argocd.argoproj.io/sync-wave: "10"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
          hosts:
            - name: pdf.foobarbaz.fr
              path: /
              tls: true
              tlsSecret: stirling-pdf-tls
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: pdf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
