apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: opencloud-isolation
  namespace: opencloud
spec:
  endpointSelector:
    matchLabels:
      app: opencloud
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": opencloud
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
  egress:
    # Rappel d'OpenCloud sur sa propre URL publique via la LB Cilium (OIDC discovery) :
    # Envoy applique la politique d'egress de ce pod sur le backend final,
    # donc le namespace lui-même doit aussi être autorisé, pas seulement l'entité ingress.
    - toEntities:
        - ingress
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": opencloud
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": auth
            app: keycloak
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Radicale + calshare (calendrier/contacts/partage, voir radicale.yaml) : auth par confiance
# de l'en-tête X-Remote-User posé par le proxy OpenCloud (+ secret X-Calshare-Secret vérifié
# par calshare), donc ne doit jamais être atteignable autrement que depuis le pod opencloud.
# calshare appelle aussi la Graph API d'OpenCloud en sortie (egress 9200, voir service.yaml).
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: opencloud-radicale-isolation
  namespace: opencloud
spec:
  endpointSelector:
    matchLabels:
      app: opencloud-radicale
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: opencloud
      toPorts:
        - ports:
            # 5233 : gate CalDAV de calshare (le Service route son port "caldav" 5232 vers
            # ce port conteneur - Radicale lui-même n'écoute plus que sur 127.0.0.1:5232,
            # donc pas atteignable via le réseau du pod, pas besoin de l'autoriser ici).
            - port: "5233"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
  egress:
    # calshare -> Graph API d'OpenCloud (in-cluster). DNS est déjà couvert par
    # baseline-allow-dns (endpointSelector: {}, tout le namespace).
    - toEndpoints:
        - matchLabels:
            app: opencloud
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
