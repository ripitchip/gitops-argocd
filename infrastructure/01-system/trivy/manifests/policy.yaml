apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator-hardened
  namespace: trivy-system
spec:
  endpointSelector: {}
  ingress:
    # Allow traffic within the namespace
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": trivy-system
    # Allow monitoring from Alloy
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
  egress:
    # 1. Internal communication
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": trivy-system
    # 2. DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 3. Kubernetes API access
    - toEntities:
        - kube-apiserver
    # 4. GitHub Access (for Trivy DB updates)
    - toFQDNs:
        - matchPattern: "*.github.com"
        - matchName: "github.com"
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "ghcr.io"
        - matchPattern: "*.ghcr.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
