apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    chart: immich
    repoURL: ghcr.io/immich-app/immich-charts
    targetRevision: 0.12.0
    helm:
      values: |
        image:
          tag: v1.105.1

        # Configuration d'Immich (Persistence)
        immich:
          persistence:
            library:
              existingClaim: immich-library-pvc

        # Ingress
        server:
          ingress:
            main:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                cert-manager.io/cluster-issuer: "letsencrypt-prod"
              hosts:
                - host: photo.foobarbaz.fr
                  paths:
                    - path: /
              tls:
                - hosts:
                    - photo.foobarbaz.fr
                  secretName: photo-tls

        # Sécurisation des contrôleurs Immich
        controllers:
          server:
            pod:
              securityContext:
                runAsNonRoot: true
                runAsUser: 15433
                runAsGroup: 15433
                fsGroup: 15433
            containers:
              main:
                resources:
                  limits:
                    cpu: "2"
                    memory: 2Gi
                  requests:
                    cpu: 500m
                    memory: 512Mi
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 15433
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                env:
                  DB_HOSTNAME: immich-postgres
                  DB_USERNAME: immich
                  DB_DATABASE_NAME: immich
                  DB_PASSWORD: immichpass
                  REDIS_HOSTNAME: immich-valkey

          machine-learning:
            pod:
              securityContext:
                runAsNonRoot: true
                runAsUser: 15435
                runAsGroup: 15435
                fsGroup: 15435
            containers:
              main:
                resources:
                  limits:
                    cpu: "1"
                    memory: 1Gi
                  requests:
                    cpu: 200m
                    memory: 256Mi
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 15435
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                env:
                  DB_HOSTNAME: immich-postgres
                  DB_USERNAME: immich
                  DB_DATABASE_NAME: immich
                  DB_PASSWORD: immichpass
                  REDIS_HOSTNAME: immich-valkey

        # Sécurisation de Valkey
        valkey:
          enabled: true
          controllers:
            main:
              pod:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 15434
                  runAsGroup: 15434
                  fsGroup: 15434
              containers:
                main:
                  resources:
                    limits:
                      cpu: 500m
                      memory: 512Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 15434
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
          persistence:
            data:
              enabled: true
              size: 1Gi
              type: emptyDir
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
