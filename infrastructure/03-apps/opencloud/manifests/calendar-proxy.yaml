# Routes supplémentaires du proxy OpenCloud vers Radicale+calshare (calendrier/contacts/
# partage), voir radicale.yaml. "additional_policies" est une clé indépendante de la
# politique de routage par défaut générée par `opencloud init` (proxy.policies),
# donc elle vient s'ajouter sans l'écraser. Mergée (via yq, voir app.yaml) sous
# la clé "proxy:" déjà présente dans opencloud.yaml, pour les mêmes raisons que
# role-mapping.yaml (pas de concaténation simple possible).
#
# X-Calshare-Secret : calshare (dans le pod opencloud-radicale) refuse toute requête sans ce
# secret, même si le réseau était ouvert - X-Remote-User seul ne suffit pas à s'authentifier
# auprès de lui. Le placeholder __CALSHARE_SECRET__ ci-dessous est substitué par la vraie
# valeur (secret opencloud-secrets, clé CALSHARE_PROXY_SECRET) dans l'initContainer
# merge-calendar-proxy de app.yaml, avant le merge yq - jamais la vraie valeur dans ce
# ConfigMap (repo public).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-calendar-proxy
  namespace: opencloud
data:
  caldav_routes.yaml: |
    proxy:
      additional_policies:
        - name: default
          routes:
            - endpoint: /caldav/
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /caldav
                - X-Calshare-Secret: __CALSHARE_SECRET__
            - endpoint: /.well-known/caldav
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /caldav
                - X-Calshare-Secret: __CALSHARE_SECRET__
            - endpoint: /carddav/
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /carddav
                - X-Calshare-Secret: __CALSHARE_SECRET__
            - endpoint: /.well-known/carddav
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /carddav
                - X-Calshare-Secret: __CALSHARE_SECRET__
            - endpoint: /calshare/
              backend: http://opencloud-radicale.opencloud.svc.cluster.local:8080
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Calshare-Secret: __CALSHARE_SECRET__
