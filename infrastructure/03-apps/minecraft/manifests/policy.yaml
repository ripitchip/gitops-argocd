apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minecraft-default-deny
  namespace: minecraft
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crafty-access
  namespace: minecraft
spec:
  endpointSelector:
    matchLabels: { app: minecraft }
  ingress:
    - fromEndpoints:
        - matchLabels: { app: velocity }
      toPorts:
        - ports:
            - { port: "25566", protocol: TCP }
            - { port: "25567", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
      toPorts:
        - ports:
            - { port: "8443", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns: [{ matchPattern: "*" }]
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
            - { port: "443", protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: velocity-access
  namespace: minecraft
spec:
  endpointSelector:
    matchLabels: { app: velocity }
  ingress:
    - fromEntities: [world, cluster]
      toPorts:
        - ports:
            - { port: "25565", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns: [{ matchPattern: "*" }]
    - toEndpoints:
        - matchLabels: { app: minecraft }
      toPorts:
        - ports:
            - { port: "25566", protocol: TCP }
            - { port: "25567", protocol: TCP }
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
            - { port: "443", protocol: TCP }
