# --- 1. GLOBAL ISOLATION (Namespace: pass) ---
# Default deny all ingress and egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pass-security-core
  namespace: pass
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Allow intra-namespace traffic for local communication and probes
    - from:
        - podSelector: {}
    # Allow Traefik to route web traffic to Vaultwarden
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
      ports:
        - { protocol: TCP, port: 80 }
  egress:
    # Allow intra-namespace traffic
    - to:
        - podSelector: {}
    # Allow DNS resolution via kube-system
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Allow connection to Vault for secret synchronization
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: vault }
      ports:
        - { protocol: TCP, port: 8200 }