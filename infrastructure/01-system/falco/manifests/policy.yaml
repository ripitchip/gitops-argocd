apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: falco-security
  namespace: falco
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "2801"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: falco
  egress:
    # 1. Internal Namespace Traffic
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: falco
    # 2. Kubernetes API access
    - toEntities:
        - kube-apiserver
    # 3. DNS Resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 4. Vault Access
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # 5. GitHub Access (for falcoctl artifacts)
    - toFQDNs:
        - matchPattern: "*.github.com"
        - matchName: "github.com"
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "ghcr.io"
        - matchPattern: "*.ghcr.io"
        - matchPattern: "*.pkg.github.com"
        - matchName: "falcosecurity.github.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 6. Sigstore Access (for artifact verification)
    - toFQDNs:
        - matchPattern: "*.sigstore.dev"
        - matchName: "sigstore.dev"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
