apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: grafana
    targetRevision: 8.5.1
    helm:
      values: |
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password
        grafana.ini:
          server:
            root_url: https://grafana.foobarbaz.fr
          auth.generic_oauth:
            enabled: true
            name: Keycloak
            allow_sign_up: true
            client_id: grafana
            client_secret: $__file{/etc/grafana/secrets/oidc-client-secret}
            scopes: openid profile email groups
            auth_url: https://auth.foobarbaz.fr/realms/master/protocol/openid-connect/auth
            token_url: https://auth.foobarbaz.fr/realms/master/protocol/openid-connect/token
            api_url: https://auth.foobarbaz.fr/realms/master/protocol/openid-connect/userinfo
            role_attribute_path: contains(groups[*], 'grafana-admin') && 'Admin' || 'Viewer'
        extraSecretMounts:
          - name: grafana-oidc-secret
            mountPath: /etc/grafana/secrets/oidc-client-secret
            subPath: oidc-client-secret
            secretName: grafana-admin-credentials
            readOnly: true
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Mimir
                type: prometheus
                url: http://mimir-gateway.mimir.svc.cluster.local/prometheus
                access: proxy
                isDefault: true
              - name: Loki
                type: loki
                url: http://loki-gateway.loki.svc.cluster.local
                access: proxy
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: "(?:trace_id|traceID|tid)=(\\w+)"
                      name: TraceID
                      url: "$${__value.raw}"
              - name: Tempo
                type: tempo
                url: http://tempo-gateway.tempo.svc.cluster.local:3100
                access: proxy
                uid: tempo

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 472
          fsGroup: 472
        containerSecurityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        persistence:
          enabled: false # Memory only for now to ensure simple deployment, can be configured later
        ingress:
          enabled: false # Managed explicitly if required, disabled by default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
