apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    chart: cilium
    repoURL: https://helm.cilium.io/
    targetRevision: 1.19.4
    helm:
      values: |
        # Exceptions au niveau du DaemonSet Agent
        annotations:
          trivy-operator.aquasecurity.github.io/skip-checks: "AVD-KSV-0037,KSV037,AVD-KSV-0009,KSV009,AVD-KSV-0017,KSV017,AVD-KSV-0021,KSV021"
        
        # Exceptions au niveau des Pods Agent
        podAnnotations:
          trivy-operator.aquasecurity.github.io/skip-checks: "AVD-KSV-0037,KSV037,AVD-KSV-0009,KSV009,AVD-KSV-0017,KSV017,AVD-KSV-0021,KSV021"

        hubble:
          enabled: true
          relay:
            enabled: true
            # Exceptions au niveau du Deployment Hubble Relay
            annotations:
              trivy-operator.aquasecurity.github.io/skip-checks: "AVD-KSV-0037,KSV037,AVD-KSV-0009,KSV009,AVD-KSV-0017,KSV017"
            # Exceptions au niveau des Pods Hubble Relay
            podAnnotations:
              trivy-operator.aquasecurity.github.io/skip-checks: "AVD-KSV-0037,KSV037,AVD-KSV-0009,KSV009,AVD-KSV-0017,KSV017"
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi

        envoy:
          enabled: true
          # Exceptions au niveau du DaemonSet Envoy
          annotations:
            trivy-operator.aquasecurity.github.io/skip-checks: "AVD-KSV-0037,KSV037,AVD-KSV-0009,KSV009,AVD-KSV-0017,KSV017"
          # Exceptions au niveau des Pods Envoy
          podAnnotations:
            trivy-operator.aquasecurity.github.io/skip-checks: "AVD-KSV-0037,KSV037,AVD-KSV-0009,KSV009,AVD-KSV-0017,KSV017"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

        operator:
          enabled: true
          # Exceptions au niveau du Deployment Operator
          annotations:
            trivy-operator.aquasecurity.github.io/skip-checks: "AVD-KSV-0037,KSV037,AVD-KSV-0009,KSV009,AVD-KSV-0017,KSV017"
          # Exceptions au niveau des Pods Operator
          podAnnotations:
            trivy-operator.aquasecurity.github.io/skip-checks: "AVD-KSV-0037,KSV037,AVD-KSV-0009,KSV009,AVD-KSV-0017,KSV017"
          clusterPoolIPv4PodCIDRList:
          - 10.244.0.0/16
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
