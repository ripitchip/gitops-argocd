apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - baseline-network-policy.yaml
  - policy.yaml
  - external-secrets.yaml
  - storage.yaml
  - app.yaml
  - edge-middlewares.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: iam-stack
    includeSelectors: true
