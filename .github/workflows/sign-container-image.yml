name: Sign Container Image

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Fully qualified image reference to sign, preferably with digest"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  sign:
    name: Cosign keyless signing
    runs-on: ubuntu-24.04
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image
        shell: bash
        run: cosign sign --yes "${{ inputs.image_ref }}"
