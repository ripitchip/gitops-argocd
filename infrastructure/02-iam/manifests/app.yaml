# --- POSTGRES ---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: auth }
spec:
  selector: { app: postgres }
  ports: [{ protocol: TCP, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: postgres
  namespace: auth
  annotations: { argocd.argoproj.io/sync-wave: "5" }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: 
        fsGroup: 3215
        runAsNonRoot: true
        runAsUser: 3215
        runAsGroup: 3215
      containers:
        - name: postgres
          image: mirror.gcr.io/postgres:17
          securityContext:
            runAsUser: 3215
            runAsGroup: 3215
            runAsNonRoot: true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - { name: POSTGRES_USER, value: "keycloak" }
            - { name: POSTGRES_DB, value: "keycloak" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-passwords, key: admin-password } }
          ports: [{ name: postgres, containerPort: 5432 }]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres-data
      volumes:
        - name: postgres-data
          persistentVolumeClaim: { claimName: keycloak-db-pvc-static }
---
# --- OPENLDAP ---
apiVersion: v1
kind: Service
metadata: { name: openldap, namespace: auth }
spec:
  selector: { app: openldap }
  ports:
    - { name: ldap, port: 389, targetPort: 8389 }
    - { name: ldaps, port: 636, targetPort: 8636 }
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: openldap
  namespace: auth
  annotations: { argocd.argoproj.io/sync-wave: "5" }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: openldap } }
  template:
    metadata: { labels: { app: openldap } }
    spec:
      securityContext: 
        fsGroup: 3951
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 3951:3951 /bitnami/openldap"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - { name: ldap-data, mountPath: /bitnami/openldap, subPath: ldap-data }
      containers:
        - name: openldap
          image: bitnamilegacy/openldap:2.6.10
          securityContext:
            runAsUser: 3951
            runAsGroup: 3951
            runAsNonRoot: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          env:
            - { name: LDAP_ROOT, value: "dc=home,dc=local" }
            - { name: LDAP_ADMIN_USERNAME, value: "admin" }
            - { name: LDAP_ADMIN_PASSWORD,
                valueFrom: { secretKeyRef: { name: ldap-passwords, key: admin-password } } }
            - { name: ORG_GROUPS_ENABLED, value: "true" }
            - { name: LDAP_PORT_NUMBER, value: "8389" }
            - { name: LDAP_LDAPS_PORT_NUMBER, value: "8636" }
            - { name: LDAP_LISTEN_ADDRESSES, value: "ldap://:8389/" }
          volumeMounts:
            - { name: ldap-data, mountPath: /bitnami/openldap, subPath: ldap-data }
            - { name: openldap-run, mountPath: /opt/bitnami/openldap/var/run }
      volumes:
        - name: ldap-data
          persistentVolumeClaim: { claimName: openldap-pvc-static }
        - name: openldap-run
          emptyDir: {}
---
# --- KEYCLOAK ---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: auth }
spec:
  selector: { app: keycloak }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: keycloak
  namespace: auth
  annotations: { argocd.argoproj.io/sync-wave: "10" }
spec:
  serviceName: keycloak
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      securityContext:
        fsGroup: 4648
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 4648:4648 /opt/keycloak/providers"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: keycloak-providers-volume
              mountPath: /opt/keycloak/providers
              subPath: providers-data
        - name: prepare-lib
          image: quay.io/keycloak/keycloak:26.6.1
          command: ["sh", "-c", "cp -rp /opt/keycloak/lib/quarkus/* /mnt/lib/"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: keycloak-lib
              mountPath: /mnt/lib
        - name: wait-for-postgres
          image: busybox:1.36
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          command: ['sh', '-c', 'until nc -vz postgres.auth.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.1
          securityContext:
            runAsUser: 4648
            runAsGroup: 4648
            runAsNonRoot: true
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          args: ["start", "--http-enabled=true"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: "admin" }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD,
                valueFrom: { secretKeyRef: { name: keycloak-passwords, key: admin-password } } }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: "xforwarded" }
            - { name: KC_HOSTNAME, value: "auth.foobarbaz.fr" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_CACHE, value: "local" }
            - { name: KC_DB, value: "postgres" }
            - { name: KC_DB_URL_HOST, value: "postgres" }
            - { name: KC_DB_URL_DATABASE, value: "keycloak" }
            - { name: KC_DB_USERNAME, value: "keycloak" }
            - { name: KC_DB_PASSWORD,
                valueFrom: { secretKeyRef: { name: keycloak-passwords, key: admin-password } } }
          volumeMounts:
            - name: keycloak-providers-volume
              mountPath: /opt/keycloak/providers
              subPath: providers-data
            - name: keycloak-lib
              mountPath: /opt/keycloak/lib/quarkus
            - name: keycloak-data
              mountPath: /opt/keycloak/data
      volumes:
        - name: keycloak-providers-volume
          persistentVolumeClaim: { claimName: keycloak-providers-pvc-static }
        - name: keycloak-lib
          emptyDir: {}
        - name: keycloak-data
          emptyDir: {}
---
# --- INGRESS ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod" 
spec:
  ingressClassName: traefik
  tls: [{ hosts: ["auth.foobarbaz.fr"], secretName: keycloak-cert-tls }]
  rules:
    - host: "auth.foobarbaz.fr"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: keycloak, port: { number: 8080 } }
