apiVersion: apps/v1
kind: Deployment
metadata:
  name: kutt
  namespace: kutt
  labels:
    app: kutt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kutt
  template:
    metadata:
      labels:
        app: kutt
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /kutt/custom"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: custom
              mountPath: /kutt/custom
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
        - name: kutt
          image: kutt/kutt:v3.2.3
          ports:
            - containerPort: 3000
          env:
            - name: DB_CLIENT
              value: pg
            - name: DB_HOST
              value: kutt-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: kutt
            - name: DB_USER
              value: kutt
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kutt-secrets
                  key: DB_PASSWORD
            - name: REDIS_ENABLED
              value: "true"
            - name: REDIS_HOST
              value: kutt-redis
            - name: REDIS_PORT
              value: "6379"
            - name: DEFAULT_DOMAIN
              value: kutt.foobarbaz.fr
            - name: SITE_NAME
              value: Kutt
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kutt-secrets
                  key: JWT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: custom
              mountPath: /kutt/custom
      volumes:
        - name: custom
          persistentVolumeClaim:
            claimName: kutt-custom-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kutt
  namespace: kutt
spec:
  selector:
    app: kutt
  ports:
    - port: 80
      targetPort: 3000
