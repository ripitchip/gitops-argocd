apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: opencloud-isolation
  namespace: opencloud
spec:
  endpointSelector:
    matchLabels:
      app: opencloud
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": opencloud
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
  egress:
    # Rappel d'OpenCloud sur sa propre URL publique via la LB Cilium (OIDC discovery) :
    # Envoy applique la politique d'egress de ce pod sur le backend final,
    # donc le namespace lui-même doit aussi être autorisé, pas seulement l'entité ingress.
    - toEntities:
        - ingress
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": opencloud
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": auth
            app: keycloak
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
