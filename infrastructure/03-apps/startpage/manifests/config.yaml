apiVersion: v1
kind: ConfigMap
metadata:
  name: startpage-site
  namespace: startpage
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Startpage</title>
        <link rel="stylesheet" href="/styles.css">
      </head>
      <body>
        <header class="topbar">
          <a class="brand" href="/">Startpage</a>
          <nav>
            <a aria-current="page" href="/">Services</a>
            <a href="/admin.html">Admin</a>
          </nav>
        </header>

        <main>
          <section class="hero">
            <p class="eyebrow">Maison</p>
            <h1>Services</h1>
            <p class="intro">Acces rapide aux applications utiles au quotidien.</p>
          </section>

          <section class="grid" aria-label="Applications utilisateur">
            <a class="tile" href="https://drive.foobarbaz.fr">
              <span class="icon">D</span>
              <span><strong>Drive</strong><small>Fichiers et partage</small></span>
            </a>
            <a class="tile" href="https://pass.foobarbaz.fr">
              <span class="icon">V</span>
              <span><strong>Vaultwarden</strong><small>Mots de passe</small></span>
            </a>
            <a class="tile" href="https://photo.foobarbaz.fr">
              <span class="icon">I</span>
              <span><strong>Immich</strong><small>Photos et videos</small></span>
            </a>
            <a class="tile" href="https://memos.foobarbaz.fr">
              <span class="icon">M</span>
              <span><strong>Memos</strong><small>Notes rapides</small></span>
            </a>
            <a class="tile" href="https://flux.foobarbaz.fr">
              <span class="icon">F</span>
              <span><strong>Miniflux</strong><small>Lecteur RSS</small></span>
            </a>
            <a class="tile" href="https://url.foobarbaz.fr">
              <span class="icon">K</span>
              <span><strong>Kutt</strong><small>Liens courts</small></span>
            </a>
            <a class="tile" href="https://cal.foobarbaz.fr">
              <span class="icon">C</span>
              <span><strong>Radicale</strong><small>Calendriers et contacts</small></span>
            </a>
            <a class="tile" href="https://share.foobarbaz.fr">
              <span class="icon">S</span>
              <span><strong>Pingvin Share</strong><small>Envoi de fichiers</small></span>
            </a>
          </section>

          <section class="group">
            <h2>Media</h2>
            <div class="grid compact">
              <a class="tile" href="https://tv.foobarbaz.fr"><span class="icon">J</span><span><strong>Jellyfin</strong><small>Films et series</small></span></a>
              <a class="tile" href="https://requests.foobarbaz.fr"><span class="icon">R</span><span><strong>Requests</strong><small>Demandes media</small></span></a>
              <a class="tile" href="https://music.foobarbaz.fr"><span class="icon">N</span><span><strong>Navidrome</strong><small>Musique</small></span></a>
              <a class="tile" href="https://radio.foobarbaz.fr"><span class="icon">R</span><span><strong>Radio</strong><small>Subwave</small></span></a>
            </div>
          </section>
        </main>
      </body>
    </html>
  admin.html: |
    <!doctype html>
    <html lang="fr">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Startpage Admin</title>
        <link rel="stylesheet" href="/styles.css">
      </head>
      <body>
        <header class="topbar">
          <a class="brand" href="/">Startpage</a>
          <nav>
            <a href="/">Services</a>
            <a aria-current="page" href="/admin.html">Admin</a>
          </nav>
        </header>

        <main>
          <section class="hero">
            <p class="eyebrow">Administration</p>
            <h1>Admin</h1>
            <p class="intro">Supervision, securite et outils de gestion du cluster.</p>
          </section>

          <section class="grid" aria-label="Applications admin">
            <a class="tile accent" href="https://grafana.foobarbaz.fr">
              <span class="icon">G</span>
              <span><strong>Grafana</strong><small>Observabilite</small></span>
            </a>
            <a class="tile" href="https://auth.foobarbaz.fr">
              <span class="icon">A</span>
              <span><strong>Keycloak</strong><small>Identite et acces</small></span>
            </a>
            <a class="tile" href="https://hubble.foobarbaz.fr">
              <span class="icon">H</span>
              <span><strong>Hubble</strong><small>Reseau Cilium</small></span>
            </a>
            <a class="tile" href="https://policy-reporter.foobarbaz.fr">
              <span class="icon">P</span>
              <span><strong>Policy Reporter</strong><small>Politiques Kyverno</small></span>
            </a>
            <a class="tile" href="https://falco.foobarbaz.fr">
              <span class="icon">F</span>
              <span><strong>Falco</strong><small>Evenements securite</small></span>
            </a>
            <a class="tile" href="https://ntfy.foobarbaz.fr">
              <span class="icon">G</span>
              <span><strong>Gotify</strong><small>Notifications</small></span>
            </a>
            <a class="tile" href="https://ai.foobarbaz.fr">
              <span class="icon">O</span>
              <span><strong>Open WebUI</strong><small>IA locale</small></span>
            </a>
            <a class="tile" href="https://deemix.foobarbaz.fr">
              <span class="icon">D</span>
              <span><strong>Deemix</strong><small>Gestion musique</small></span>
            </a>
