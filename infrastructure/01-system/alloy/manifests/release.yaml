apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: alloy
    targetRevision: 0.9.1
    helm:
      values: |
        alloy:
          configMap:
            content: |
              logging {
                level  = "info"
                format = "logfmt"
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }

              // --- Metrics (Prometheus) ---
              
              // Standard pod scraping (excluding specialized jobs to avoid duplicates)
              discovery.relabel "generic_pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  regex         = "node-exporter|kube-state-metrics"
                  action        = "drop"
                }
              }

              prometheus.scrape "metrics" {
                targets    = discovery.relabel.generic_pods.output
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Specific scraping for Node Exporter
              prometheus.scrape "node_exporter" {
                targets = [{
                  __address__ = "node-exporter.alloy.svc.cluster.local:9100",
                  job         = "node-exporter",
                }]
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              prometheus.scrape "kube_state_metrics" {
                targets = [{
                  __address__ = "kube-state-metrics.alloy.svc.cluster.local:8080",
                  job         = "kube-state-metrics",
                }]
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Specific scraping for CoreDNS
              discovery.relabel "coredns" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_k8s_app"]
                  regex         = "kube-system;kube-dns"
                  action        = "keep"
                }
                rule {
                  action = "replace"
                  target_label = "job"
                  replacement = "coredns"
                }
              }

              prometheus.scrape "coredns" {
                targets    = discovery.relabel.coredns.output
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Specific scraping for Cilium
              discovery.relabel "cilium" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
                  regex         = "cilium"
                  action        = "keep"
                }
                rule {
                  action = "replace"
                  target_label = "job"
                  replacement = "cilium"
                }
              }

              prometheus.scrape "cilium" {
                targets    = discovery.relabel.cilium.output
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Specific scraping for etcd
              discovery.relabel "etcd" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_component"]
                  regex         = "kube-system;etcd"
                  action        = "keep"
                }
                rule {
                  action = "replace"
                  target_label = "job"
                  replacement = "etcd"
                }
              }

              prometheus.scrape "etcd" {
                targets    = discovery.relabel.etcd.output
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              // Specific scraping for Keycloak
              discovery.relabel "keycloak" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app"]
                  regex         = "auth;keycloak"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  action = "replace"
                  target_label = "job"
                  replacement = "keycloak/keycloak-metrics"
                }
                rule {
                  action = "replace"
                  target_label = "namespace"
                  replacement = "keycloak"
                }
                rule {
                  action = "replace"
                  target_label = "container"
                  replacement = "keycloak"
                }
              }

              prometheus.scrape "keycloak_metrics" {
                targets    = discovery.relabel.keycloak.output
                metrics_path = "/metrics"
                // Keycloak metrics are on port 9000
                forward_to = [prometheus.relabel.keycloak_port.receiver]
              }

              prometheus.relabel "keycloak_port" {
                forward_to = [prometheus.remote_write.mimir.receiver]
                rule {
                  source_labels = ["__address__"]
                  regex         = "(.*):8080"
                  target_label  = "__address__"
                  replacement   = "${1}:9000"
                }
              }

              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir-nginx.mimir.svc.cluster.local/api/v1/push"
                }
              }

              // --- Traces (Tempo) ---
              otelcol.receiver.otlp "default" {
                grpc { endpoint = "0.0.0.0:4317" }
                http { endpoint = "0.0.0.0:4318" }
                output {
                  traces  = [otelcol.exporter.otlp.tempo.input]
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.tempo.svc.cluster.local:4317"
                  tls { insecure = true }
                }
              }

              // --- Logs (Loki) ---
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name", "__meta_kubernetes_namespace"]
                  regex         = "keycloak;auth"
                  target_label  = "namespace"
                  replacement   = "keycloak"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  action        = "replace"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.cri.receiver]
              }

              loki.process "cri" {
                forward_to = [loki.write.local.receiver]

                stage.cri {}
              }

              loki.write "local" {
                endpoint {
                  url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
                }
              }

          mounts:
            varlog: true
            dockercontainers: true
          
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
        
        controller:
          type: daemonset

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
