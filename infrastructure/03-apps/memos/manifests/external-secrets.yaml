apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: memos-vault-store
  namespace: memos
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "memos-role"
          serviceAccountRef:
            name: "memos-vault-sa"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-oidc-secret
  namespace: memos
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: memos-vault-store
    kind: SecretStore
  target:
    name: memos-oidc-auth
    creationPolicy: Owner
  data:
    - secretKey: OIDC_SECRET
      remoteRef:
        key: memos-secrets
        property: oidc-secret
