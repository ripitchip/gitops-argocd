apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-scrapper-db
  namespace: finance-scrapper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: finance-scrapper-db
  template:
    metadata:
      labels:
        app: finance-scrapper-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 29097
        runAsGroup: 29097
        fsGroup: 29097
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/lib/postgresql/data/pgdata && chown -R 29097:29097 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: advisor
            - name: POSTGRES_DB
              value: advisor
            - name: POSTGRES_PASSWORD
              valueFrom: 
                secretKeyRef: 
                  name: finance-scrapper-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 29097
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
      volumes:
        - name: postgres-data
          persistentVolumeClaim: 
            claimName: finance-scrapper-db-pvc
        - name: postgres-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finance-scrapper-db
  namespace: finance-scrapper
spec:
  selector:
    app: finance-scrapper-db
  ports:
    - port: 5432
      targetPort: 5432
