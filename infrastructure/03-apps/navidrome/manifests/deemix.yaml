apiVersion: v1
kind: ConfigMap
metadata:
  name: deemix-scripts
  namespace: navidrome
data:
  fix_lyrics.sh: |
    #!/bin/sh
    echo "[LRCLIB-FIX] Starting recursive scanning for MP3 files missing LRC lyrics..."
    find /downloads -type f -name "*.mp3" | while read -r mp3_path; do
        base_path="${mp3_path%.mp3}"
        lrc_path="$base_path.lrc"
        if [ -f "$lrc_path" ]; then
            continue
        fi
        relative_path=$(echo "$mp3_path" | sed 's|^/downloads/||')
        artist=$(echo "$relative_path" | cut -d'/' -f1)
        filename=$(basename "$base_path")
        clean_title=$(echo "$filename" | sed -E 's/^[0-9]+[[:space:]]*-[[:space:]]*//')
        echo "[LRCLIB-FIX] --------------------------------------------------------"
        echo "[LRCLIB-FIX] Target File Detected: $filename"
        echo "[LRCLIB-FIX] Extracted Artist: $artist"
        echo "[LRCLIB-FIX] Extracted Track Title: $clean_title"
        artist_enc=$(echo "$artist" | sed 's/ /%20/g; s/(/%28/g; s/)/%29/g; s/&/%26/g; s/’/%27/g; s/'\''/%27/g' | tr -d '\n' | tr -d '\r')
        title_enc=$(echo "$clean_title" | sed 's/ /%20/g; s/(/%28/g; s/)/%29/g; s/&/%26/g; s/’/%27/g; s/'\''/%27/g' | tr -d '\n' | tr -d '\r')
        url_api="https://lrclib.net/api/search?artist_name=${artist_enc}&track_name=${title_enc}"
        echo "[LRCLIB-FIX] Querying Target Endpoint: $url_api"
        response=$(curl -s "$url_api")
        if [ -z "$response" ] || [ "$response" = "[]" ]; then
            echo "[LRCLIB-FIX] HTTP Alert: Payload empty or metadata unmatched on LRCLIB servers."
            echo "[LRCLIB-FIX] Status: Execution Failed."
            continue
        fi
        synced_lyrics=$(echo "$response" | grep -o '"syncedLyrics":"[^"]*"' | head -n 1 | sed 's/"syncedLyrics":"//' | sed 's/"$//')
        if [ ! -z "$synced_lyrics" ] && [ "$synced_lyrics" != "null" ]; then
            echo "[LRCLIB-FIX] Matching payload extracted successfully. Compiling LRC structure..."
            echo "$synced_lyrics" | sed 's/\\"/"/g' | awk '{gsub(/\\n/, "\n")}1' > "$lrc_path"
            chown 45249:45249 "$lrc_path" 2>/dev/null
            echo "[LRCLIB-FIX] Status: Dynamic lyrics injected dynamically."
        else
            echo "[LRCLIB-FIX] Parser Alert: Track identified on LRCLIB but missing time-synced data blocks."
            echo "[LRCLIB-FIX] Status: Execution Failed."
        fi
    done
    echo "[LRCLIB-FIX] --------------------------------------------------------"
    echo "[LRCLIB-FIX] Scanning procedure completed successfully."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deemix
  namespace: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deemix
  template:
    metadata:
      labels:
        app: deemix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 45249
        runAsGroup: 45249
        fsGroup: 45249
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            ["sh", "-c", "chown -R 45249:45249 /run /tmp /config /downloads"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      containers:
        - name: deemix
          image: ghcr.io/bambanah/deemix:v4.5.2
          command: ["node", "/app/packages/webui/dist/main.js"]
          args: ["--port", "6595", "--host", "0.0.0.0", "--singleuser"]
          ports:
            - name: http
              containerPort: 6595
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DEEMIX_DATA_DIR
              value: "/config"
            - name: DEEMIX_MUSIC_DIR
              value: "/downloads"
            - name: PUID
              value: "45249"
            - name: PGID
              value: "45249"
            - name: DEEMIX_SINGLE_USER
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: deemix-config-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: navidrome-music-pvc
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: deemix-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: deemix
  namespace: navidrome
spec:
  selector:
    app: deemix
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deemix-oauth2-proxy
  namespace: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deemix-oauth2-proxy
  template:
    metadata:
      labels:
        app: deemix-oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          args:
            - --provider=oidc
            - --skip-provider-button=true
            - --oidc-issuer-url=https://auth.foobarbaz.fr/realms/foobarbaz
            - --user-id-claim=preferred_username
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --upstream=http://deemix:80
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --cookie-domain=.foobarbaz.fr
            - --whitelist-domain=.foobarbaz.fr
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --session-store-type=cookie
            - --redirect-url=https://deemix.foobarbaz.fr/oauth2/callback
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: "deemix"
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deemix-oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: deemix-oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: deemix-oauth2-proxy
  namespace: navidrome
spec:
  selector:
    app: deemix-oauth2-proxy
  ports:
    - name: http
      port: 80
      targetPort: 4180
