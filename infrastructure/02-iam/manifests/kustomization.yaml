apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - policy.yaml
  - external-secrets.yaml
  - storage.yaml
  - app.yaml

configMapGenerator:
  - name: keycloak-theme-part-aa
    files:
      - theme-parts/keycloak-theme-part-aa
  - name: keycloak-theme-part-ab
    files:
      - theme-parts/keycloak-theme-part-ab
  - name: keycloak-theme-part-ac
    files:
      - theme-parts/keycloak-theme-part-ac
  - name: keycloak-theme-part-ad
    files:
      - theme-parts/keycloak-theme-part-ad

labels:
  - pairs:
      app.kubernetes.io/part-of: iam-stack
    includeSelectors: true
