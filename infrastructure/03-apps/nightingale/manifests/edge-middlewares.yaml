apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: nightingale
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "microphone=(self), fullscreen=(self), clipboard-read=(self), clipboard-write=(self)"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limit, namespace: nightingale }
spec: { rateLimit: { average: 100, burst: 200 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: compress, namespace: nightingale }
spec: { compress: {} }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: public-chain, namespace: nightingale }
spec:
  chain:
    middlewares:
      - name: security-headers
      - name: rate-limit
      - name: compress
