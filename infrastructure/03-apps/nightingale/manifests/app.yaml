apiVersion: v1
kind: Service
metadata:
  name: nightingale
  namespace: nightingale
spec:
  selector:
    app: nightingale
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightingale
  namespace: nightingale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nightingale
  template:
    metadata:
      labels:
        app: nightingale
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nightingale
          image: ghcr.io/rzru/nightingale:0.9.0
          env:
            - name: NIGHTINGALE_BIND
              value: "0.0.0.0:8080"
            - name: NIGHTINGALE_DATA_PATH
              value: /data
            - name: NIGHTINGALE_LIBRARY_PATH
              value: /songs
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /songs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nightingale-data-pvc
        - name: music
          persistentVolumeClaim:
            claimName: nightingale-music-pvc
