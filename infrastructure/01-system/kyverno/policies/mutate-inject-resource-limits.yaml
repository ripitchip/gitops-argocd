apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-inject-resource-limits
  annotations:
    policies.kyverno.io/title: Inject Resource Limits (Auto-fix)
    policies.kyverno.io/category: Best Practices
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet,Job,CronJob
    policies.kyverno.io/description: >-
      Automatically adds default resource limits to pods in system namespaces if they are missing.
spec:
  admission: true
  background: true
  rules:
    - name: inject-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - kube-system
                - metallb-system
                - traefik
                - cert-manager
                - vault
                - argocd
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                resources:
                  requests:
                    +(cpu): "100m"
                    +(memory): "128Mi"
                  limits:
                    +(cpu): "500m"
                    +(memory): "512Mi"
