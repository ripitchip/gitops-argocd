apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-security-core
  namespace: vault
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: vault } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [podSelector: {}] # Clustering Raft
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: auth }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pass }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: external-secrets }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
      ports:
        - { protocol: TCP, port: 8200 }
  egress:
    - to: [podSelector: {}]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]