apiVersion: v1
kind: PersistentVolume
metadata:
  name: minecraft-data-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions: ["nfsvers=4.1", "hard"]
  nfs:
    server: "10.0.60.10"
    path: "/mnt/data/k8s-cluster/pvc-volumes/minecraft-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 50Gi
  volumeName: minecraft-data-pv
---
