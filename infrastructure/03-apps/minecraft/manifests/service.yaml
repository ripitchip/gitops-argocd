apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  annotations:
    metallb.io/loadBalancerIPs: "10.0.50.201"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: velocity }
  ports:
    - { name: minecraft, port: 25565, targetPort: minecraft, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: crafty-servers
  namespace: minecraft
spec:
  selector: { app: minecraft }
  ports:
    - { name: famille, port: 25566, targetPort: famille, protocol: TCP }
    - { name: world, port: 25567, targetPort: world, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: crafty
  namespace: minecraft
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: minecraft-crafty-transport@kubernetescrd
spec:
  selector: { app: minecraft }
  ports:
    - { name: https, port: 8443, targetPort: https, protocol: TCP }
