apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app: opencloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-config
          image: opencloudeu/opencloud:7.2.4
          command: ["/bin/sh", "-c"]
          args: ["opencloud init || true"]
          env:
            # sans ça, "opencloud init" demande une réponse interactive sur stdin
            # (qui n'existe pas dans un pod) et boucle indéfiniment sur le prompt
            - name: OC_INSECURE
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: data
              mountPath: /var/lib/opencloud
              subPath: data
        # `opencloud init` écrit un seul fichier /etc/opencloud/opencloud.yaml avec une clé
        # top-level par service (proxy:, graph:, idm:, ...). role-mapping.yaml doit donc être
        # mergé dans la clé "proxy:" existante, pas juste concaténé (sinon clé dupliquée/ignorée).
        - name: merge-role-mapping
          image: mikefarah/yq:4.44.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
                /etc/opencloud/opencloud.yaml /etc/opencloud-role-mapping/role_assignment.yaml \
                > /tmp/merged.yaml
              cat /tmp/merged.yaml > /etc/opencloud/opencloud.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: role-mapping
              mountPath: /etc/opencloud-role-mapping
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Idem que merge-role-mapping ci-dessus : ajoute les routes caldav/carddav
        # (voir calendar-proxy.yaml) sous la clé "proxy:" déjà présente.
        - name: merge-calendar-proxy
          image: mikefarah/yq:4.44.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
                /etc/opencloud/opencloud.yaml /etc/opencloud-calendar-proxy/caldav_routes.yaml \
                > /tmp/merged.yaml
              cat /tmp/merged.yaml > /etc/opencloud/opencloud.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: calendar-proxy
              mountPath: /etc/opencloud-calendar-proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # https://github.com/mschneider82/opencloud-web-calendar v0.0.7, sha256-verified,
        # dropped into $OC_DATA_DIR/web/assets/apps (see opencloud-web-config for registration).
        - name: install-web-calendar
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import hashlib, io, os, urllib.request, zipfile
              url = "https://github.com/mschneider82/opencloud-web-calendar/releases/download/v0.0.7/web-app-calendar.zip"
              expected_sha256 = "05375d1dad4577d5f48bdbef893e98939aaef029b2baaa22fc8f0369eca6bde9"
              data = urllib.request.urlopen(url).read()
              digest = hashlib.sha256(data).hexdigest()
              assert digest == expected_sha256, f"sha256 mismatch: got {digest}"
              target = "/var/lib/opencloud/web/assets/apps/web-calendar"
              os.makedirs(target, exist_ok=True)
              zipfile.ZipFile(io.BytesIO(data)).extractall(target)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
              subPath: data
      containers:
        - name: opencloud
          image: opencloudeu/opencloud:7.2.4
          command: ["opencloud"]
          args: ["server"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OC_URL
              value: "https://cloud.tomlab.fr"
            # TLS terminé par l'ingress Cilium
            - name: PROXY_TLS
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
            - name: OC_INSECURE
              value: "false"
            - name: OC_LOG_LEVEL
              value: "info"
            # NFS : pas d'inotify/xattrs fiables, donc pas de driver posix
            - name: STORAGE_USERS_DRIVER
              value: "decomposed"
            # --- OIDC : Keycloak externe (client public "web" dans le realm) ---
            - name: OC_OIDC_ISSUER
              value: "https://auth.foobarbaz.fr/realms/foobarbaz"
            # l'IDP intégré est remplacé par Keycloak, l'IDM (LDAP interne) reste
            - name: OC_EXCLUDE_RUN_SERVICES
              value: "idp"
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_USER_OIDC_CLAIM
              value: "preferred_username"
            - name: PROXY_USER_CS3_CLAIM
              value: "username"
            # les comptes sont créés dans l'IDM à la première connexion
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: OC_LDAP_SERVER_WRITE_ENABLED
              value: "true"
            - name: GRAPH_USERNAME_MATCH
              value: "none"
            # rôle attribué selon le groupe Keycloak (claim "groups"), voir role-mapping.yaml
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: "oidc"
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: "groups"
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "true"
            - name: WEB_OPTION_ACCOUNT_EDIT_LINK_HREF
              value: "https://auth.foobarbaz.fr/realms/foobarbaz/account"
            # le navigateur doit pouvoir joindre Keycloak (connect-src / frame-src)
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: "/etc/opencloud-csp/csp.yaml"
            # only way to inject "external_apps" (see web-calendar-config.yaml)
            - name: WEB_UI_CONFIG_FILE
              value: "/etc/opencloud-web-config/config.json"
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: IDM_ADMIN_PASSWORD
          ports:
            - containerPort: 9200
              name: http
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /etc/opencloud
              subPath: config
            - name: data
              mountPath: /var/lib/opencloud
              subPath: data
            - name: csp
              mountPath: /etc/opencloud-csp
              readOnly: true
            - name: web-config
              mountPath: /etc/opencloud-web-config
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data-pvc
        - name: csp
          configMap:
            name: opencloud-csp
        - name: web-config
          configMap:
            name: opencloud-web-config
        - name: role-mapping
          configMap:
            name: opencloud-role-mapping
        - name: calendar-proxy
          configMap:
            name: opencloud-calendar-proxy
        - name: tmp
          emptyDir: {}
