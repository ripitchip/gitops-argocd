apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: mimir-distributed
    targetRevision: 5.3.0
    helm:
      values: |
        deploymentMode: monolithic
        mimir:
          structuredConfig:
            multitenancy_enabled: false
            common:
              storage:
                backend: filesystem
            blocks_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/blocks
            alertmanager_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/alerts
            ruler_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/rules
        
        # Security Context for Kyverno compliance (Restricted Profile)
        podSecurityContext:
          runAsUser: 11985
          runAsGroup: 11985
          fsGroup: 11985
          runAsNonRoot: true
        
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 11985

        # Sub-charts
        minio:
          enabled: true
          # DO NOT define 'buckets' here; it triggers a buggy Job in this chart version
          securityContext:
            enabled: true
            runAsUser: 11985
            runAsGroup: 11985
            fsGroup: 11985
            runAsNonRoot: true
          containerSecurityContext:
            enabled: true
            runAsNonRoot: true
            runAsUser: 11985
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        rollout_operator:
          enabled: true
          podSecurityContext:
            runAsUser: 11985
            runAsGroup: 11985
            fsGroup: 11985
            runAsNonRoot: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 11985

        nginx:
          enabled: true
        
        # Resource limits for all components (Kyverno requirement)
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi

        mimir-continuous-test:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mimir
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
