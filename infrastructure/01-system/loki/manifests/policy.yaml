apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: loki-security
  namespace: loki
spec:
  endpointSelector:
    matchLabels: {}
  ingress:
    # 1. Allow Prometheus/Grafana to scrape metrics and query
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": grafana
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # 2. Allow Alloy/Promtail to push logs
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # 3. Internal namespace traffic
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": loki

  egress:
    # 1. DNS Resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 2. Kubernetes API access
    - toEntities:
        - kube-apiserver
