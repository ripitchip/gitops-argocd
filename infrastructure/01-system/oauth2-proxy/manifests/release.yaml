apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: 'https://oauth2-proxy.github.io/manifests'
    chart: oauth2-proxy
    targetRevision: 10.6.0
    helm:
      values: |
        config:
          existingSecret: oauth2-proxy-creds
        
        authenticatedEmailsFile:
          enabled: false
        
        proxyVarsAsHeaders: true
        replicaCount: 1
        
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: oauth2-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
