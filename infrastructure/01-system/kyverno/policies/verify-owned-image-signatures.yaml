apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-owned-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Owned Image Signatures
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Require keyless Cosign signatures for images published under ghcr.io/ripitchip.
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Audit
  webhookTimeoutSeconds: 30
  failurePolicy: Ignore
  background: false
  rules:
    - name: verify-ghcr-ripitchip-keyless-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      skipBackgroundRequests: true
      verifyImages:
        - imageReferences:
            - ghcr.io/ripitchip/*
          mutateDigest: false
          verifyDigest: false
          useCache: true
          required: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: ^https://github.com/ripitchip/.+/.github/workflows/.+@refs/heads/main$
                    rekor:
                      url: https://rekor.sigstore.dev
                  signatureAlgorithm: sha256
