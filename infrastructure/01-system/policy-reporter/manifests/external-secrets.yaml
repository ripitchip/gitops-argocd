# 1. ServiceAccount for Vault Auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: policy-reporter
---
# 2. SecretStore pointing to Vault with policy-reporter-role
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: policy-reporter
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "policy-reporter-role"
          serviceAccountRef:
            name: "vault-auth"
---
# 3. Synchronize Policy Reporter OAuth2 Proxy Secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: policy-reporter-oauth2-proxy-creds
  namespace: policy-reporter
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: policy-reporter-oauth2-proxy-creds
    creationPolicy: Owner
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: policy-reporter-oauth2-proxy
        property: cookie_secret
    - secretKey: client-secret
      remoteRef:
        key: policy-reporter-oauth2-proxy
        property: client_secret
