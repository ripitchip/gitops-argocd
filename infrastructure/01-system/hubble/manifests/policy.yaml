apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: hubble-stack-policy
  namespace: hubble
spec:
  endpointSelector: {} # Appliqué à tout le namespace hubble
  ingress:
    # 1. Autoriser Traefik vers le proxy (4180) et l'UI Hubble (8080)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8089"
              protocol: TCP

  egress:
    # 1. Autoriser tout le namespace à contacter le DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 2. Autoriser Hubble UI vers le Relay dans kube-system
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": hubble-relay
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # 3. Autoriser Hubble UI vers Kubernetes API et Internet (pour l'auth Keycloak)
    - toEntities:
        - kube-apiserver
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
