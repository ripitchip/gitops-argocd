apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome
  namespace: navidrome
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - music.foobarbaz.fr
      secretName: navidrome-tls
  rules:
    - host: music.foobarbaz.fr
      http:
        paths:
          # Mobile et partage en direct
          - path: /rest
            pathType: Prefix
            backend:
              service: { name: navidrome, port: { number: 80 } }
          - path: /share
            pathType: Prefix
            backend:
              service: { name: navidrome, port: { number: 80 } }
          # Interface Web via le Proxy
          - path: /
            pathType: Prefix
            backend:
              service: { name: navidrome-oauth2-proxy, port: { number: 80 } }
