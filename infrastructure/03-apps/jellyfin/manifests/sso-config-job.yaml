apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-sso-config
  namespace: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: jellyfin-sso-config
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: configure-sso
          image: curlimages/curl:8.5.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 40202
            runAsGroup: 40202
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jellyfin-secrets
                  key: JELLYFIN_API_KEY
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jellyfin-secrets
                  key: OIDC_CLIENT_SECRET
          command:
            - sh
            - -c
            - |
              set -eu

              echo "Waiting for the SSO-Auth plugin to be loaded..."
              i=0
              until curl -sf "http://jellyfin.jellyfin.svc.cluster.local/SSO/OID/GetNames" > /dev/null; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "Timed out waiting for the SSO-Auth plugin" >&2
                  exit 1
                fi
                sleep 5
              done

              cat > /tmp/payload.json <<EOF
              {
                "oidEndpoint": "https://auth.foobarbaz.fr/realms/foobarbaz",
                "oidClientId": "jellyfin",
                "oidSecret": "${OIDC_CLIENT_SECRET}",
                "enabled": true,
                "enableAuthorization": true,
                "enableAllFolders": true,
                "enabledFolders": [],
                "adminRoles": ["jellyfin-admin"],
                "roles": ["user"],
                "enableFolderRoles": false,
                "folderRoleMapping": [],
                "roleClaim": "realm_access.roles",
                "oidScopes": ["openid", "profile", "email"],
                "defaultUsernameClaim": "preferred_username"
              }
              EOF

              echo "Registering the keycloak OIDC provider in SSO-Auth..."
              curl -sf -X POST \
                -H "Content-Type: application/json" \
                --data @/tmp/payload.json \
                "http://jellyfin.jellyfin.svc.cluster.local/SSO/OID/Add/keycloak?api_key=${JELLYFIN_API_KEY}"

              cat > /tmp/branding.json <<'EOF'
              {
                "loginDisclaimer": "<form action='https://tv.tomlab.fr/sso/OID/start/keycloak'><button class='raised block emby-button button-submit'>Sign in with Keycloak</button></form>",
                "customCss": "a.raised.emby-button { padding: 0.9em 1em; color: inherit !important; } .disclaimerContainer { display: block; }",
                "splashscreenEnabled": false
              }
              EOF

              echo "Adding the SSO login button to the Jellyfin branding config..."
              curl -sf -X POST \
                -H "Content-Type: application/json" \
                --data @/tmp/branding.json \
                "http://jellyfin.jellyfin.svc.cluster.local/System/Configuration/Branding?api_key=${JELLYFIN_API_KEY}"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
