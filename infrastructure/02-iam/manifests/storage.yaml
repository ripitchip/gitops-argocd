apiVersion: v1
kind: PersistentVolume
metadata: { name: openldap-pv-static }
spec:
  capacity: { storage: 5Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions: ["nfsvers=4.1", "hard"]
  nfs: { server: "10.0.60.10", path: "/mnt/data/k8s-cluster/pvc-volumes/openldap" }
  claimRef: { name: openldap-pvc-static, namespace: auth }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: openldap-pvc-static, namespace: auth }
spec:
  storageClassName: truenas-nfs
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
  volumeName: openldap-pv-static
---
