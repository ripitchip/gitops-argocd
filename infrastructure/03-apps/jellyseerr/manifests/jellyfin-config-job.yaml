apiVersion: batch/v1
kind: Job
metadata:
  name: jellyseerr-jellyfin-config
  namespace: jellyseerr
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: jellyseerr-jellyfin-config
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 30550
        runAsGroup: 30550
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: configure-jellyfin
          image: python:3.12-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 30550
            runAsGroup: 30550
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: JELLYFIN_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jellyseerr-secrets
                  key: JELLYFIN_ADMIN_USERNAME
            - name: JELLYFIN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyseerr-secrets
                  key: JELLYFIN_ADMIN_PASSWORD
          command:
            - sh
            - -c
            - |
              cat << 'EOF' > /tmp/configure_jellyfin.py
              import json
              import os
              import sys
              import time
              import http.cookiejar
              import urllib.error
              import urllib.request

              BASE = "http://jellyseerr.jellyseerr.svc.cluster.local/api/v1"
              JELLYFIN_INTERNAL_URL = "http://jellyfin.jellyfin.svc.cluster.local"
              JELLYFIN_EXTERNAL_URL = "https://tv.tomlab.fr"

              ADMIN_USER = os.environ["JELLYFIN_ADMIN_USERNAME"]
              ADMIN_PASS = os.environ["JELLYFIN_ADMIN_PASSWORD"]

              jar = http.cookiejar.CookieJar()
              opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

              def call(method, path, body=None):
                  data = None
                  if method != "GET":
                      data = json.dumps(body).encode() if body is not None else b""
                  request = urllib.request.Request(BASE + path, data=data, method=method)
                  request.add_header("Content-Type", "application/json")
                  with opener.open(request, timeout=15) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}

              print("Waiting for Jellyseerr to be ready...")
              public_settings = None
              for _ in range(60):
                  try:
                      public_settings = call("GET", "/settings/public")
                      break
                  except (urllib.error.URLError, urllib.error.HTTPError):
                      time.sleep(5)
              if public_settings is None:
                  print("Timed out waiting for Jellyseerr", file=sys.stderr)
                  sys.exit(1)

              if public_settings.get("initialized"):
                  print("Jellyseerr already initialized, skipping Jellyfin auto-config.")
                  sys.exit(0)

              print("Logging in to Jellyfin (first login becomes the Jellyseerr admin)...")
              call("POST", "/auth/jellyfin", {
                  "username": ADMIN_USER,
                  "password": ADMIN_PASS,
                  "hostname": JELLYFIN_INTERNAL_URL,
              })

              print("Setting the Jellyfin server connection settings...")
              call("POST", "/settings/jellyfin", {
                  "hostname": JELLYFIN_INTERNAL_URL,
                  "externalHostname": JELLYFIN_EXTERNAL_URL,
                  "adminUser": ADMIN_USER,
                  "adminPass": ADMIN_PASS,
              })

              print("Syncing Jellyfin libraries...")
              libraries = call("POST", "/settings/jellyfin/library/sync")

              for library in libraries:
                  library_id = library.get("id")
                  print(f"Enabling library '{library.get('name')}' ({library_id})...")
                  call("PUT", f"/settings/jellyfin/library/{library_id}", {"enabled": True})

              print("Marking Jellyseerr as initialized...")
              call("POST", "/settings/initialize")

              print("Done.")
              EOF
              python3 /tmp/configure_jellyfin.py
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
