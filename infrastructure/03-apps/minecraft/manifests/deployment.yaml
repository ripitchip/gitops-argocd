apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 52433
        runAsGroup: 22851
        fsGroup: 22851
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          imagePullPolicy: Always
          env:
            - name: EULA
              value: "TRUE"
            - name: UID
              value: "52433"
            - name: GID
              value: "22851"
            - name: TYPE
              value: VANILLA
            - name: VERSION
              value: LATEST
            - name: MEMORY
              value: 4G
            - name: TZ
              value: Europe/Paris
            - name: ONLINE_MODE
              value: "TRUE"
            - name: ENABLE_RCON
              value: "false"
            - name: MOTD
              value: "Serveur Minecraft"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: minecraft
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
