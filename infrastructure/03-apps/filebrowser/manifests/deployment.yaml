apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 18096
        runAsGroup: 18096
        fsGroup: 18096
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 18096:18096 /database"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /database
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:v2.44.0
          args:
            - "--noauth"
            - "--root=/srv"
            - "--database=/database/filebrowser.db"
            - "--address=0.0.0.0"
            - "--port=80"
          env:
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 80
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 18096
            runAsGroup: 18096
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: media
              mountPath: /srv
            - name: config
              mountPath: /database
            - name: fb-settings
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: filebrowser-media-pvc
        - name: config
          persistentVolumeClaim:
            claimName: filebrowser-config-pvc
        - name: fb-settings
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  selector:
    app: filebrowser
  ports:
    - port: 80
      targetPort: 80
