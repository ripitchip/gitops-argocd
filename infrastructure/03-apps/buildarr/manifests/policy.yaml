apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: buildarr-policy
  namespace: buildarr
spec:
  endpointSelector:
    matchLabels:
      app: buildarr
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": prowlarr
            "k8s:app": prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
