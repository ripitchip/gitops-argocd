apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-storage
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - mkdir -p /data/backups /data/config /data/import /data/logs /data/servers
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: crafty-data
              mountPath: /data
      containers:
        - name: crafty
          image: registry.gitlab.com/crafty-controller/crafty-4:4.10.7
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Paris
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: https
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v2/crafty/check
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v2/crafty/check
              port: https
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: crafty-data
              mountPath: /crafty/backups
              subPath: backups
            - name: crafty-data
              mountPath: /crafty/app/config
              subPath: config
            - name: crafty-data
              mountPath: /crafty/import
              subPath: import
            - name: crafty-data
              mountPath: /crafty/logs
              subPath: logs
            - name: crafty-data
              mountPath: /crafty/servers
              subPath: servers
            - name: minecraft-data
              mountPath: /crafty/import/current-server
              readOnly: true
      volumes:
        - name: crafty-data
          persistentVolumeClaim:
            claimName: crafty-data
        - name: minecraft-data
          persistentVolumeClaim:
            claimName: minecraft-data
