apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: mimir-distributed
    targetRevision: 5.3.0
    helm:
      values: |
        deploymentMode: monolithic
        mimir:
          structuredConfig:
            multitenancy_enabled: false
            common:
              storage:
                backend: filesystem
            blocks_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/blocks
            alertmanager_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/alerts
            ruler_storage:
              backend: filesystem
              filesystem:
                dir: /mimir-storage/rules
            alertmanager:
              data_dir: /data/local/alertmanager
            compactor:
              data_dir: /data/local/compactor
            ruler:
              rule_path: /data/local/ruler

        # Shared Storage Mount (NFS)
        # We mount the shared PVC on all components that need access to the common filesystem backend
        commonSharedVolume: &commonSharedVolume
          extraVolumes:
            - name: mimir-storage
              persistentVolumeClaim:
                claimName: mimir-storage-pvc
          extraVolumeMounts:
            - name: mimir-storage
              mountPath: /mimir-storage

        # Default resources with limits for Kyverno compliance
        defaultResources: &defaultResources
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

        ingester:
          replicas: 1
          persistentVolume:
            size: 10Gi
            storageClass: truenas-nfs
          <<: [*commonSharedVolume, *defaultResources]

        querier:
          replicas: 1
          <<: [*commonSharedVolume, *defaultResources]

        distributor:
          replicas: 1
          <<: *defaultResources

        compactor:
          persistentVolume:
            size: 20Gi
            storageClass: truenas-nfs
          <<: [*commonSharedVolume, *defaultResources]

        store_gateway:
          persistentVolume:
            size: 10Gi
            storageClass: truenas-nfs
          <<: [*commonSharedVolume, *defaultResources]

        alertmanager:
          enabled: true
          fallbackConfig: |
            global:
              smtp_from: contact@foobarbaz.fr
              smtp_smarthost: ssl0.ovh.net:587
              smtp_auth_username: contact@foobarbaz.fr
              smtp_auth_password_file: /etc/alertmanager-smtp/smtp-password
              smtp_require_tls: true

            route:
              receiver: alerts-both
              group_by: [cluster, alertname]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h

            receivers:
              - name: alerts-both
                email_configs:
                  - to: contact@foobarbaz.fr
                    send_resolved: true
                    from: contact@foobarbaz.fr
                    smarthost: ssl0.ovh.net:587
                    auth_username: contact@foobarbaz.fr
                    auth_password_file: /etc/alertmanager-smtp/smtp-password
                    require_tls: true
                  - to: cluster-alerts@mailrise.xyz
                    send_resolved: true
                    from: contact@foobarbaz.fr
                    smarthost: mailrise.notifications.svc.cluster.local:25
                    auth_username: ""
                    auth_password_file: ""
                    require_tls: false

          persistentVolume:
            size: 5Gi
            storageClass: truenas-nfs
          extraVolumes:
            - name: alertmanager-smtp
              secret:
                secretName: mimir-alertmanager-smtp
          extraVolumeMounts:
            - name: alertmanager-smtp
              mountPath: /etc/alertmanager-smtp
              readOnly: true
          <<: [*commonSharedVolume, *defaultResources]

        ruler:
          enabled: true
          persistentVolume:
            size: 5Gi
            storageClass: truenas-nfs
          <<: [*commonSharedVolume, *defaultResources]

        nginx:
          <<: *defaultResources

        rollout_operator:
          <<: *defaultResources

        overrides_exporter:
          <<: *defaultResources

        query_frontend:
          <<: *defaultResources

        query_scheduler:
          <<: *defaultResources

        # Security Context for Kyverno compliance (Restricted Profile)
        global:
          podSecurityContext:
            runAsUser: 11985
            runAsGroup: 11985
            fsGroup: 11985
            runAsNonRoot: true
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 11985
        
        # Disable MinIO as we use NFS filesystem storage
        minio:
          enabled: false

        mimir-continuous-test:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mimir
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
