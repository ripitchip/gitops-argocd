apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudreve
  namespace: cloudreve
  labels:
    app: cloudreve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudreve
  template:
    metadata:
      labels:
        app: cloudreve
    spec:
      serviceAccountName: cloudreve-sa
      imagePullSecrets:
        - name: cloudreve-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 13010
        runAsGroup: 13010
        fsGroup: 13010
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 13010:13010 /cloudreve/uploads"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: cloudreve-data
              mountPath: /cloudreve/uploads
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
      - name: cloudreve
        image: cloudreve.azurecr.io/cloudreve/pro:4.16.1
        ports:
        - containerPort: 5212
        env:
        - name: DB_Host
          value: cloudreve-postgres
        - name: DB_User
          value: cloudreve
        - name: DB_Name
          value: cloudreve
        - name: DB_Password
          valueFrom:
            secretKeyRef:
              name: cloudreve-secrets
              key: DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 13010
        volumeMounts:
        - name: cloudreve-data
          mountPath: /cloudreve/uploads
      volumes:
      - name: cloudreve-data
        persistentVolumeClaim:
          claimName: cloudreve-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudreve
  namespace: cloudreve
spec:
  selector:
    app: cloudreve
  ports:
  - port: 5212
    targetPort: 5212
