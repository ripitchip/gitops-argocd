apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deemix
  namespace: navidrome
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - deemix.foobarbaz.fr
      secretName: deemix-tls
  rules:
    - host: deemix.foobarbaz.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deemix-oauth2-proxy
                port:
                  number: 80
