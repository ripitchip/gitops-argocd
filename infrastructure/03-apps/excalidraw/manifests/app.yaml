apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw-app
  namespace: excalidraw
  labels: { app: excalidraw-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: excalidraw-app } }
  template:
    metadata: { labels: { app: excalidraw-app } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 18335
        fsGroup: 18335
      containers:
        - name: excalidraw
          image: excalidraw/excalidraw:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 18335
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PORT
              value: "8080"
          resources:
            limits: { cpu: 200m, memory: 256Mi }
            requests: { cpu: 50m, memory: 128Mi }
          ports: [{ containerPort: 8080, name: http }]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: excalidraw-nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: excalidraw-nginx-config
  namespace: excalidraw
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: excalidraw-app
  namespace: excalidraw
spec:
  selector: { app: excalidraw-app }
  ports: [{ port: 80, targetPort: 8080 }]
