apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: bentopdf-isolation
  namespace: pdf
spec:
  endpointSelector:
    matchLabels:
      app: bentopdf
  ingress:
    # 1. Internal Namespace Traffic
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": pdf
    # 2. External Traffic via Ingress (Cilium Envoy)
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # 3. Monitoring (Alloy)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
