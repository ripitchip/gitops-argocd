apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "n8n-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets-sync
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: n8n-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DB_PASSWORD: "{{ .db_password }}"
        N8N_ENCRYPTION_KEY: "{{ .encryption_key }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: n8n-secrets
        property: db-password
    - secretKey: encryption_key
      remoteRef:
        key: n8n-secrets
        property: encryption-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-oauth2-proxy-creds-sync
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: n8n-oauth2-proxy-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: n8n-secrets
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: n8n-secrets
        property: cookie-secret
