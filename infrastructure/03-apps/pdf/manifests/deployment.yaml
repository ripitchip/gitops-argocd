apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: pdf
  labels:
    app.kubernetes.io/name: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stirling-pdf
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 13042
        runAsGroup: 13042
        fsGroup: 13042
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SECURITY_ENABLELOGIN
              value: "false"
            - name: LANGS
              value: "en_GB"
            - name: HOME
              value: "/tmp"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: tessdata-volume
              mountPath: /usr/share/tessdata
            - name: configs-volume
              mountPath: /configs
            - name: logs-volume
              mountPath: /logs
            - name: pipeline-volume
              mountPath: /pipeline
      volumes:
        - name: tessdata-volume
          emptyDir: {}
        - name: configs-volume
          emptyDir: {}
        - name: logs-volume
          emptyDir: {}
        - name: pipeline-volume
          emptyDir: {}
