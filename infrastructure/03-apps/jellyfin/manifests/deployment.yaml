apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 18096
        runAsGroup: 18096
        fsGroup: 18096
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 18096:18096 /config"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: config-volume
              mountPath: /config
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
        - name: install-sso-plugin
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              PLUGIN_DIR=/config/plugins/SSO-Auth_4.0.0.4
              if [ -f "$PLUGIN_DIR/meta.json" ]; then
                echo "SSO-Auth plugin already installed, skipping"
                exit 0
              fi
              mkdir -p "$PLUGIN_DIR"
              wget -O /tmp/sso-auth.zip https://github.com/9p4/jellyfin-plugin-sso/releases/download/v4.0.0.4/sso-authentication_4.0.0.4.zip
              unzip -o /tmp/sso-auth.zip -d "$PLUGIN_DIR"
              rm -f /tmp/sso-auth.zip
              cat > "$PLUGIN_DIR/meta.json" <<'EOF'
              {
                "category": "Authentication",
                "guid": "505ce9d1-d916-42fa-86ca-673ef241d7df",
                "name": "SSO-Auth",
                "description": "SSO Authentication via OpenID Connect / SAML",
                "overview": "Allows users to authenticate via an external OIDC provider (Keycloak)",
                "owner": "9p4",
                "version": "4.0.0.4",
                "targetAbi": "10.11.0.0",
                "framework": "net9.0",
                "timestamp": "2026-03-20T03:13:34Z",
                "assemblies": ["SSO-Auth.dll"]
              }
              EOF
          securityContext:
            runAsNonRoot: true
            runAsUser: 18096
            runAsGroup: 18096
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-volume
              mountPath: /config
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.0
          ports:
            - containerPort: 8096
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 18096
            runAsGroup: 18096
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: cache-volume
              mountPath: /cache
            - name: media-volume
              mountPath: /media
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
        - name: media-volume
          persistentVolumeClaim:
            claimName: jellyfin-media-pvc
        - name: cache-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
    - port: 80
      targetPort: 8096
