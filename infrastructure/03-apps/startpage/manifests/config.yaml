        </main>
      </body>
    </html>
  styles.css: |
    :root {
      color-scheme: dark;
      --bg: #171918;
      --panel: #222523;
      --panel-strong: #2b302d;
      --text: #f0f2ee;
      --muted: #aab0a8;
      --line: #3a403b;
      --accent: #c4d64f;
      --accent-2: #68b8d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(104, 184, 216, 0.18), transparent 32rem),
        linear-gradient(135deg, #171918 0%, #202421 55%, #191b1a 100%);
      color: var(--text);
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem clamp(1rem, 4vw, 3rem);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(23, 25, 24, 0.9);
      backdrop-filter: blur(14px);
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0;
    }

    nav {
      display: flex;
      gap: 0.5rem;
    }

    nav a {
      min-width: 5.5rem;
      padding: 0.55rem 0.8rem;
      border: 1px solid transparent;
      border-radius: 0.45rem;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    nav a[aria-current="page"] {
      border-color: var(--line);
      background: var(--panel);
      color: var(--text);
    }

    main {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4.5rem) 0;
    }

    .hero {
      max-width: 44rem;
      margin-bottom: 2rem;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5.6rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .intro {
      max-width: 34rem;
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .group {
      margin-top: 2.5rem;
    }

    h2 {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
      gap: 0.8rem;
    }

    .tile {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      min-height: 5.8rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: rgba(34, 37, 35, 0.86);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.22);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--panel-strong);
      outline: none;
    }

    .tile.accent {
      border-color: rgba(196, 214, 79, 0.55);
    }

    .icon {
      display: grid;
      flex: 0 0 2.7rem;
      width: 2.7rem;
      height: 2.7rem;
      place-items: center;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #141614;
      font-weight: 900;
    }

    strong,
    small {
      display: block;
    }

    strong {
      font-size: 1rem;
    }

    small {
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 560px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      nav a {
        flex: 1;
      }

      .tile {
        min-height: 5.2rem;
      }
    }
