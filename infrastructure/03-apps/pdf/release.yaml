apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stirling-pdf
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: 'https://github.com/ripitchip/gitops-argocd.git'
    path: infrastructure/03-apps/pdf
    targetRevision: HEAD
    helm:
      values: |
        image:
          tag: "2.10.1"
        
        envs:
          - name: SERVER_PORT
            value: "8080"
          - name: SERVER_FORWARD_HEADERS_STRATEGY
            value: "native"
          - name: SYSTEM_BACKENDURL
            value: "https://pdf.foobarbaz.fr"
          - name: SECURITY_ENABLELOGIN
            value: "false"
          - name: HOME
            value: "/tmp"
          - name: DOCKER_ENABLE_CHOWN
            value: "false"

        deployment:
          annotations:
            argocd.argoproj.io/sync-wave: "5"
          extraVolumes:
            - name: tmp-volume
              emptyDir: {}
            - name: logs-volume
              emptyDir: {}
            - name: configs-volume
              emptyDir: {}
            - name: pipeline-volume
              emptyDir: {}
            - name: custom-files-volume
              emptyDir: {}
          extraVolumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: logs-volume
              mountPath: /logs
            - name: configs-volume
              mountPath: /configs
            - name: pipeline-volume
              mountPath: /pipeline
            - name: custom-files-volume
              mountPath: /customFiles

        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"

        securityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 13042
          runAsGroup: 13042
          fsGroup: 13042
        
        containerSecurityContext:
          runAsUser: 13042
          runAsGroup: 13042
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

        service:
          externalPort: 80

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            argocd.argoproj.io/sync-wave: "10"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
          hosts:
            - name: pdf.foobarbaz.fr
              path: /
              tls: true
              tlsSecret: stirling-pdf-tls
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: pdf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
