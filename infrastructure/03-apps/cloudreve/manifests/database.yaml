apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudreve-postgres
  namespace: cloudreve
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudreve-postgres
  template:
    metadata:
      labels:
        app: cloudreve-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 16446
        runAsGroup: 16446
        fsGroup: 16446
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 16446:16446 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: cloudreve
            - name: POSTGRES_DB
              value: cloudreve
            - name: POSTGRES_PASSWORD
              valueFrom: 
                secretKeyRef: 
                  name: cloudreve-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 16446
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim: 
            claimName: cloudreve-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudreve-postgres
  namespace: cloudreve
spec:
  selector:
    app: cloudreve-postgres
  ports:
    - port: 5432
      targetPort: 5432
