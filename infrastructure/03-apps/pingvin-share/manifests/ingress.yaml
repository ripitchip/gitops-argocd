apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingvin-share
  namespace: pingvin-share
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    ingress.cilium.io/loadbalancer-mode: "shared"
spec:
  ingressClassName: cilium
  rules:
  - host: share.foobarbaz.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pingvin-share
            port:
              number: 80
  tls:
  - hosts:
    - share.foobarbaz.fr
    secretName: pingvin-share-tls
