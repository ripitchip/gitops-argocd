apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    chart: falco
    repoURL: https://falcosecurity.github.io/charts
    targetRevision: 8.0.5
    helm:
      values: |
        driver:
          kind: modern_ebpf
        falco:
          json_output: true
          stdout_output: { enabled: true }
          log_level: info
        resources:
          requests: { cpu: 150m, memory: 512Mi }
          limits: { cpu: 1000m, memory: 1024Mi }
        falcoctl:
          artifact:
            install:
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 256Mi }
            follow:
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 256Mi }
        tolerations:
          - { effect: NoSchedule, key: node-role.kubernetes.io/master }
          - { effect: NoSchedule, key: node-role.kubernetes.io/control-plane }
        falcosidekick:
          enabled: true
          config:
            loki:
              hostport: "http://loki-gateway.loki.svc.cluster.local"
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 5639
            runAsGroup: 5639
            fsGroup: 5639
          securityContext:
            runAsNonRoot: true
            runAsUser: 5639
            runAsGroup: 5639
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          webui:
            enabled: true
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 7104
              runAsGroup: 7104
              fsGroup: 7104
            securityContext:
              runAsNonRoot: true
              runAsUser: 7104
              runAsGroup: 7104
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            # Utilisation du secret généré par ExternalSecret (Vault)
            existingSecret: "falco-ui-secrets"
            user: "admin" # Doit correspondre à la clé admin-user dans Vault
            password: "" # Laissé vide car existingSecret est utilisé
            redis:
              podSecurityContext:
                runAsNonRoot: true
                runAsUser: 9253
                runAsGroup: 9253
                fsGroup: 9253
              securityContext:
                runAsNonRoot: true
                runAsUser: 9253
                runAsGroup: 9253
              storageEnabled: true
              resources:
                limits:
                  cpu: 200m
                  memory: 2Gi
                requests:
                  cpu: 100m
                  memory: 1Gi
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
              hosts:
                - host: falco.foobarbaz.fr
                  paths: [{ path: /, pathType: Prefix }]
              tls:
                - { secretName: falco-ui-tls, hosts: [falco.foobarbaz.fr] }
        customRules:
          production-security.yaml: |-
            - macro: k8s_containers
              override:
                condition: append
              condition: or container.image.repository in (quay.io/argoproj/argocd, ghcr.io/external-secrets/external-secrets, quay.io/jetstack/cert-manager-controller, hashicorp/vault)
            - rule: Interactive Shell Spawned in Container
              desc: Detects interactive shells in sensitive namespaces
              condition: spawned_process and container and (k8s.ns.name in (vault, auth, pass, pdf, falco, argocd, external-secrets, cert-manager)) and proc.name in (shell_procs)
              output: "Interactive shell spawned (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name cmd=%proc.cmdline)"
              priority: NOTICE
            - rule: Package Installation Activity in Pod
              desc: Detects actual package installation or upgrade inside a container, excluding harmless architecture checks
              condition: spawned_process and proc.name in (package_mgmt_binaries) and container.id != "host" and k8s.pod.name != "<NA>" and (proc.cmdline contains " install" or proc.cmdline contains " update" or proc.cmdline contains " upgrade" or proc.cmdline contains " -i " or proc.cmdline contains " add ")
              output: "CRITICAL: Package installation or upgrade in POD (user=%user.name pod=%k8s.pod.name cmd=%proc.cmdline)"
              priority: CRITICAL
            - rule: Sensitive Authentication File Modified in Container
              desc: Detects writes to local authentication and privilege files from inside a container
              condition: open_write and container and fd.name in (/etc/passwd, /etc/shadow, /etc/group, /etc/sudoers, /root/.ssh/authorized_keys) and not proc.name in (passwd, useradd, groupadd, chpasswd)
              output: "CRITICAL: Sensitive authentication file modified in container (user=%user.name pod=%k8s.pod.name file=%fd.name proc=%proc.cmdline)"
              priority: CRITICAL
            - rule: Container Access to Docker Socket
              desc: Detects a container reading or writing the Docker socket, which can enable host-level control
              condition: (open_read or open_write) and container and fd.name=/var/run/docker.sock
              output: "CRITICAL: Container accessed Docker socket (user=%user.name pod=%k8s.pod.name proc=%proc.cmdline)"
              priority: CRITICAL
  destination:
    server: "https://kubernetes.default.svc"
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
