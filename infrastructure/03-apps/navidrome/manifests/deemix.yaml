apiVersion: apps/v1
kind: Deployment
metadata:
  name: deemix
  namespace: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deemix
  template:
    metadata:
      labels:
        app: deemix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 45249
        runAsGroup: 45249
        fsGroup: 45249
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deemix
          image: ghcr.io/bambanah/deemix:v4.5.2
          ports:
            - containerPort: 6595
          env:
            - name: PUID
              value: "45249"
            - name: PGID
              value: "45249"
            - name: DEEMIX_SINGLE_USER
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: deemix-config-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: navidrome-music-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: deemix
  namespace: navidrome
spec:
  selector:
    app: deemix
  ports:
    - port: 80
      targetPort: 6595
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deemix-oauth2-proxy
  namespace: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deemix-oauth2-proxy
  template:
    metadata:
      labels:
        app: deemix-oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          args:
            - --provider=oidc
            - --skip-provider-button=true
            - --oidc-issuer-url=https://auth.foobarbaz.fr/realms/foobarbaz
            - --user-id-claim=preferred_username
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --upstream=http://deemix:80
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --cookie-domain=.foobarbaz.fr
            - --whitelist-domain=.foobarbaz.fr
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --session-store-type=cookie
            - --redirect-url=https://deemix.foobarbaz.fr/oauth2/callback
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: "deemix"
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deemix-oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: deemix-oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: deemix-oauth2-proxy
  namespace: navidrome
spec:
  selector:
    app: deemix-oauth2-proxy
  ports:
    - name: http
      port: 80
      targetPort: 4180
