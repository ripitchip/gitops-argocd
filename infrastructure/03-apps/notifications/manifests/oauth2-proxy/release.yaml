apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy-oauth2-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: 'https://oauth2-proxy.github.io/manifests'
    chart: oauth2-proxy
    targetRevision: 10.6.0
    helm:
      values: |
        fullnameOverride: ntfy-oauth2-proxy
        config:
          existingSecret: ntfy-oauth2-proxy-creds
        
        extraArgs:
          - --provider=keycloak-oidc
          - --reverse-proxy=true
          - --redirect-url=https://ntfy.foobarbaz.fr/oauth2/callback
          - --oidc-issuer-url=https://auth.foobarbaz.fr/realms/master
          - --email-domain=*
          - --upstream=http://ntfy:80
          - --http-address=0.0.0.0:4180
          - --cookie-domain=.foobarbaz.fr
          - --whitelist-domain=.foobarbaz.fr
          - --cookie-secure=true
          - --cookie-httponly=true
          - --cookie-samesite=lax
          - --session-store-type=cookie

        ingress:
          enabled: false
          className: traefik
          path: /oauth2
          hosts:
            - ntfy.foobarbaz.fr
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
          tls:
            - hosts:
                - ntfy.foobarbaz.fr
              secretName: ntfy-tls

        service:
          portNumber: 4180

        authenticatedEmailsFile:
          enabled: false
        
        proxyVarsAsHeaders: true
        replicaCount: 1
        
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: notifications
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
