apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls-cert
  namespace: grafana
spec:
  dnsNames:
  - grafana.foobarbaz.fr
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: grafana-tls
  usages:
  - digital signature
  - key encipherment
