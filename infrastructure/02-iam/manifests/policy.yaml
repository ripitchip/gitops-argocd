# --- 1. GLOBAL ISOLATION ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-security-core
  namespace: auth
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: vault }
      ports: [{ protocol: TCP, port: 8200 }]
    # --- ALLOW KUBERNETES API (The Missing Fix) ---
    - to:
        - ipBlock: { cidr: 10.96.0.0/12 }
      ports:
        - { protocol: TCP, port: 443 }