apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "sure-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-secrets-sync
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: sure-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        SECRET_KEY_BASE: "{{ .secret_key_base }}"
        DB_PASSWORD: "{{ .db_password }}"
        DATABASE_URL: "postgresql://sure:{{ .db_password }}@sure-postgres.sure.svc.cluster.local:5432/sure?sslmode=disable"
        OIDC_CLIENT_ID: "{{ .oidc_client }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OIDC_ISSUER: "{{ .oidc_issuer }}"
        OIDC_REDIRECT_URI: "{{ .oidc_redirect_uri }}"
        redis-password: "{{ .redis_password }}"
        REDIS_URL: "redis://default:{{ .redis_password }}@sure-redis-local.sure.svc.cluster.local:6379/0"
  data:
    - secretKey: secret_key_base
      remoteRef:
        key: sure-secrets
        property: secret-key-base
    - secretKey: db_password
      remoteRef:
        key: sure-secrets
        property: db-password
    - secretKey: oidc_client
      remoteRef:
        key: sure-secrets
        property: oidc-client
    - secretKey: oidc_client_secret
      remoteRef:
        key: sure-secrets
        property: oidc-client-secret
    - secretKey: oidc_issuer
      remoteRef:
        key: sure-secrets
        property: oidc-issuer
    - secretKey: oidc_redirect_uri
      remoteRef:
        key: sure-secrets
        property: oidc-redirect-uri
    - secretKey: redis_password
      remoteRef:
        key: sure-secrets
        property: redis-password
