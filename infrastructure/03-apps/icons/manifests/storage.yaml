apiVersion: v1
kind: PersistentVolume
metadata:
  name: icons-data-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: truenas-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: "10.0.60.10"
    path: "/mnt/data/k8s-cluster/pvc-volumes/icons-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: icons-data-pvc
  namespace: icons
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  storageClassName: truenas-nfs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: icons-data-pv
