apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: tempo
    targetRevision: 1.10.1
    helm:
      values: |
        tempo:
          repository: grafana/tempo
          tag: 2.4.1
          multitenancyEnabled: false
          reportingEnabled: false
          metricsGenerator:
            enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          storage:
            trace:
              backend: local
              local:
                path: /tmp/tempo/traces
              wal:
                path: /tmp/tempo/wal

        builder:
          replicas: 1

        # Pod security context to comply with Kyverno policies.
        # The tempo chart maps this value to pod.spec.securityContext.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 12906
          runAsGroup: 12906

        # Keep container-only fields out of this chart value. Kubernetes drops
        # them from pod.spec.securityContext, which creates permanent Argo CD drift.
        securityContext:
          runAsNonRoot: true
          runAsUser: 12906
          runAsGroup: 12906
        
        persistence:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tempo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
