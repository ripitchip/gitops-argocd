apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: immich
  annotations: { argocd.argoproj.io/sync-wave: "-5" }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: immich
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "immich-role"
          serviceAccountRef: { name: "vault-auth" }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secrets-sync
  namespace: immich
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  refreshInterval: "1h"
  secretStoreRef: { name: vault-backend, kind: SecretStore }
  target:
    name: immich-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: immich-secrets, property: db-password }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: immich-secrets, property: oidc-client-secret }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: immich-secrets, property: redis-password }
