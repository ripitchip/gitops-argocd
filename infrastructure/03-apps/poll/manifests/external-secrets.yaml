apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: poll
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: poll
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "poll-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: poll-secrets-sync
  namespace: poll
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: poll-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        NEXT_MONGODB_URI: "mongodb://{{ .mongodb_root_username }}:{{ .mongodb_root_password }}@poll-mongodb:27017/poll?authSource=admin&directConnection=true"
        MONGO_INITDB_ROOT_USERNAME: "{{ .mongodb_root_username }}"
        MONGO_INITDB_ROOT_PASSWORD: "{{ .mongodb_root_password }}"
        MONGO_INITDB_DATABASE: "poll"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        ENCRYPTION_IV: "{{ .encryption_iv }}"
        NEXT_PUBLIC_ENCRYPTION_KEY: "{{ .encryption_key }}"
        NEXT_PUBLIC_ENCRYPTION_IV: "{{ .encryption_iv }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        NEXTAUTH_SECRET: "{{ .oidc_client_secret }}"
  data:
    - secretKey: mongodb_root_username
      remoteRef:
        key: poll-secrets
        property: mongodb-root-username
    - secretKey: mongodb_root_password
      remoteRef:
        key: poll-secrets
        property: mongodb-root-password
    - secretKey: mongodb_database
      remoteRef:
        key: poll-secrets
        property: mongodb-database
    - secretKey: encryption_key
      remoteRef:
        key: poll-secrets
        property: encryption-key
    - secretKey: encryption_iv
      remoteRef:
        key: poll-secrets
        property: encryption-iv
    - secretKey: oidc_client_secret
      remoteRef:
        key: poll-secrets
        property: oidc-client-secret
