# --- POLICY 1: REPO SERVER (The only one allowed to talk to Git) ---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repo-server-egress
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  ingress:
    # Allow traffic from other ArgoCD components (e.g. argocd-server)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argocd
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    # 0. CRITICAL: Kubernetes API access
    - toEntities:
        - kube-apiserver
    # 1. Allow DNS to resolve GitHub/GitLab
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 2. Limit HTTPS egress to world for troubleshooting
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 3. Allow internal communication with Redis (Cache)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

---
# --- POLICY 2: CORE COMPONENTS (API, OIDC, Internal) ---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: argocd-core-egress
  namespace: argocd
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-application-controller
          - argocd-server
          - argocd-applicationset-controller
          - argocd-dex-server
          - argocd-notifications-controller
  ingress:
    # 1. Allow traffic from Traefik
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
    # 2. Allow internal communication
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argocd
    # 3. Allow monitoring from Alloy
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
  egress:
    # 1. CRITICAL: Kubernetes API access
    - toEntities:
        - kube-apiserver
    # 2. DNS Resolution (Required for FQDN policies)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 3. OIDC / KEYCLOAK ACCESS
    - toFQDNs:
        - matchName: "auth.foobarbaz.fr"
    - toEntities:
        - world
        - host
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 4. INTERNAL SERVICE ACCESS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": auth
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": external-secrets
    # 5. Communication between ALL ArgoCD components
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argocd

---
# --- POLICY 3: ALLOW ALL ARGOCD PODS TO BE SCRAPED BY ALLOY ---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-monitoring
  namespace: argocd
spec:
  endpointSelector: {} # Applies to all pods in the namespace
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": alloy
