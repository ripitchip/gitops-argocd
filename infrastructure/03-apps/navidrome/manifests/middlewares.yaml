apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: navidrome-auth
  namespace: navidrome
spec:
  forwardAuth:
    address: http://navidrome-oauth2-proxy.navidrome.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - "X-Forwarded-Preferred-Username"
      - "X-Auth-Request-User"
      - "X-Auth-Request-Email"
      - "X-Auth-Request-Preferred-Username"
      - "Set-Cookie"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: navidrome-auth-errors
  namespace: navidrome
spec:
  errors:
    status:
      - "401"
    service:
      name: navidrome-auth-redirect
      port: 80
    query: "/"
