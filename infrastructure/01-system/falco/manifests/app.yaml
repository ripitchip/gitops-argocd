apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    chart: falco
    repoURL: https://falcosecurity.github.io/charts
    targetRevision: 8.0.5
    helm:
      values: |
        driver:
          kind: modern_ebpf
        falco:
          privileged: false
          podSecurityContext:
            runAsUser: 4821
            runAsGroup: 4821
            fsGroup: 4821
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 4821
            runAsGroup: 4821
            capabilities:
              drop: [ALL]
              add: [CAP_SYS_PTRACE, CAP_SYS_RESOURCE, CAP_BPF, CAP_PERFMON]
          json_output: true
          stdout_output: { enabled: true }
          log_level: info
        resources:
          requests: { cpu: 150m, memory: 512Mi }
          limits: { cpu: 1000m, memory: 1024Mi }
        tolerations:
          - { effect: NoSchedule, key: node-role.kubernetes.io/master }
          - { effect: NoSchedule, key: node-role.kubernetes.io/control-plane }
        falcosidekick:
          enabled: true
          config:
            loki:
              host: "http://loki-gateway.loki.svc.cluster.local"
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 5639
            runAsGroup: 5639
            fsGroup: 5639
          securityContext:
            runAsNonRoot: true
            runAsUser: 5639
            runAsGroup: 5639
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          webui:
            enabled: true
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 7104
              runAsGroup: 7104
              fsGroup: 7104
            securityContext:
              runAsNonRoot: true
              runAsUser: 7104
              runAsGroup: 7104
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            # Utilisation du secret généré par ExternalSecret (Vault)
            existingSecret: "falco-ui-secrets"
            user: "admin" # Doit correspondre à la clé admin-user dans Vault
            password: "" # Laissé vide car existingSecret est utilisé
            redis:
              podSecurityContext:
                runAsNonRoot: true
                runAsUser: 9253
                runAsGroup: 9253
                fsGroup: 9253
              securityContext:
                runAsNonRoot: true
                runAsUser: 9253
                runAsGroup: 9253
              storageEnabled: true
              resources:
                limits:
                  cpu: 200m
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 512Mi
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
              hosts:
                - host: falco.foobarbaz.fr
                  paths: [{ path: /, pathType: Prefix }]
              tls:
                - { secretName: falco-ui-tls, hosts: [falco.foobarbaz.fr] }
        customRules:
          production-security.yaml: |-
            - macro: k8s_containers
              override:
                condition: append
              condition: or container.image.repository in (quay.io/argoproj/argocd, ghcr.io/external-secrets/external-secrets, quay.io/jetstack/cert-manager-controller, hashicorp/vault)
            - rule: Interactive Shell Spawned in Container
              desc: Detects interactive shells in sensitive namespaces
              condition: spawned_process and container and (k8s.ns.name in (vault, auth, pass, pdf, falco, argocd, external-secrets, cert-manager)) and proc.name in (shell_procs)
              output: "Interactive shell spawned (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name cmd=%proc.cmdline)"
              priority: NOTICE
            - rule: Package Management Activity in Pod
              desc: Detects package manager execution inside a container
              condition: spawned_process and proc.name in (package_mgmt_binaries) and container.id != "host" and k8s.pod.name != "<NA>"
              output: "CRITICAL: Package manager execution in POD (user=%user.name pod=%k8s.pod.name cmd=%proc.cmdline)"
              priority: CRITICAL
  destination:
    server: "https://kubernetes.default.svc"
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
