apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
  namespace: radicale
  labels:
    app: radicale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radicale
  template:
    metadata:
      labels:
        app: radicale
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 57238
        fsGroup: 57238
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 57238:57238 /data /plugins"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plugins
              mountPath: /plugins
        - name: install-plugin
          image: tomsquest/docker-radicale:3.7.3.0
          command: ["sh", "-c", "pip install --target /plugins radicale-modoboa-auth-oauth2"]
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      containers:
        - name: radicale
          image: tomsquest/docker-radicale:3.7.3.0
          env:
            - name: PYTHONPATH
              value: /plugins
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 57238
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5232
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plugins
              mountPath: /plugins
            - name: config
              mountPath: /config/config
              subPath: config
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: radicale-data-pvc
        - name: plugins
          emptyDir: {}
        - name: config
          configMap:
            name: radicale-config
