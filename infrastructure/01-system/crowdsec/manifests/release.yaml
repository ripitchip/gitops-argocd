apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: 'https://crowdsecurity.github.io/helm-charts'
    chart: crowdsec
    targetRevision: 0.24.0
    helm:
      values: |
        config:
          simulation.yaml: |
            simulation: false
            exclusions:
              - crowdsecurity/http-probing
              - crowdsecurity/http-crawl-non_statics
        lapi:
          env:
            # Pre-register Traefik bouncer using the secret token
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  name: crowdsec-bouncer-key
                  key: bouncer-key
          persistentVolume:
            config:
              enabled: false
            data:
              enabled: true
              existingClaim: crowdsec-db-pvc
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 50Mi
        agent:
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/linux crowdsecurity/whitelist-good-actors crowdsecurity/base-http-scenarios crowdsecurity/http-cve"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 50Mi
          acquisition:
            - namespace: traefik
              podName: traefik-*
              program: traefik
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
