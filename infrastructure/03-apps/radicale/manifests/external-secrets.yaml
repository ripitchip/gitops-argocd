# 1. ServiceAccount for Vault Auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: radicale
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
# 2. SecretStore pointing to Vault
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: radicale
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "radicale-role"
          serviceAccountRef:
            name: "vault-auth"
---
# 3. Synchronize Radicale Secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radicale-secrets-sync
  namespace: radicale
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: radicale-oauth2-creds
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: radicale-oauth2-creds
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: radicale-oauth2-creds
        property: client_secret
