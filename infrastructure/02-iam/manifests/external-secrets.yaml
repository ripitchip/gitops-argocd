# 1. Identité pour Vault (Wave -9)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: auth
  annotations: { argocd.argoproj.io/sync-wave: "-9" }
---
# 2. Le Store (Wave -8)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations: { argocd.argoproj.io/sync-wave: "-8" }
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "keycloak-role"
          serviceAccountRef:
            name: "vault-auth"
            namespace: "auth"
---
# 3. Synchronisation Keycloak (Wave -7)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets-sync
  namespace: auth
  annotations: { argocd.argoproj.io/sync-wave: "-7" }
spec:
  refreshInterval: "15s"
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: keycloak-passwords
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef: { key: keycloak-admin, property: password }
    - secretKey: db-password
      remoteRef: { key: keycloak-admin, property: password }
---
# 4. Synchronisation LDAP (Wave -7)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ldap-secrets-sync
  namespace: auth
  annotations: { argocd.argoproj.io/sync-wave: "-7" }
spec:
  refreshInterval: "15s"
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: ldap-passwords
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef: { key: ldap-secrets, property: admin_password }
    - secretKey: jwt-secret
      remoteRef: { key: ldap-secrets, property: jwt_secret }
    - secretKey: key-seed
      remoteRef: { key: ldap-secrets, property: key_seed }