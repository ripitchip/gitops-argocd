apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - policy.yaml
  - external-secrets.yaml
  - storage.yaml
  - app.yaml

configMapGenerator:
  - name: keycloak-theme-parts
    files:
      - theme-parts/part-aa
      - theme-parts/part-ab
      - theme-parts/part-ac
      - theme-parts/part-ad
      - theme-parts/part-ae
      - theme-parts/part-af
      - theme-parts/part-ag
      - theme-parts/part-ah
      - theme-parts/part-ai
      - theme-parts/part-aj
      - theme-parts/part-ak
      - theme-parts/part-al
      - theme-parts/part-am
      - theme-parts/part-an
      - theme-parts/part-ao
      - theme-parts/part-ap
      - theme-parts/part-aq
      - theme-parts/part-ar
      - theme-parts/part-as
      - theme-parts/part-at
      - theme-parts/part-au
      - theme-parts/part-av
      - theme-parts/part-aw

labels:
  - pairs:
      app.kubernetes.io/part-of: iam-stack
    includeSelectors: true
