apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: auth-security-hardened
  namespace: auth
spec:
  endpointSelector: {}
  ingress:
    # 1. Allow all internal traffic within the 'auth' namespace
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": auth
    # 2. Allow Ingress from Traefik and Vault
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
        - matchLabels:
            io.kubernetes.pod.namespace: vault
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # 1. Allow all internal traffic within the 'auth' namespace
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": auth
    # 2. Kubernetes API access
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

