apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: buildarr
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: buildarr
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "buildarr-role"
          serviceAccountRef:
            name: "vault-auth"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildarr-config-secrets-sync
  namespace: buildarr
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: buildarr-config-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        buildarr-secrets.yml: |
          prowlarr:
            api_key: "{{ .prowlarrApiKey }}"
            settings:
              apps:
                applications:
                  definitions:
                    "Sonarr":
                      api_key: "{{ .sonarrApiKey }}"
  data:
    - secretKey: prowlarrApiKey
      remoteRef:
        key: prowlarr-secrets
        property: api-key
    - secretKey: sonarrApiKey
      remoteRef:
        key: sonarr-secrets
        property: api-key
